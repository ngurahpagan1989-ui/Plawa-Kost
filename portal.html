<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Penghuni - Plawa Kost</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-200 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Supabase Client
    const SUPABASE_URL = 'https://oqqrarwwbhxdpocaerog.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xcXJhcnd3Ymh4ZHBvY2Flcm9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMDI1NDksImV4cCI6MjEwNjY3ODU0OX0.XHVPjy01DZHo5uKhGZyClA-Jr6nKeqQi4FajatbSZKI';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const KOST_PAYMENT_INFO = {
      bankName: 'BCA',
      accountNumber: '1234-5678-90',
      accountHolder: 'Pengelola Plawa Kost',
      ownerWa: '6281234567890'
    };

    function App() {
      const [tenant, setTenant] = useState(null);
      const [room, setRoom] = useState(null);
      const [bills, setBills] = useState([]);
      const [complaints, setComplaints] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      const [activeTab, setActiveTab] = useState('bills');
      const [newTitle, setNewTitle] = useState('');
      const [newDesc, setNewDesc] = useState('');
      const [savingComplaint, setSavingComplaint] = useState(false);

      // Modal Form Konfirmasi Bayar & Tanda Tangan
      const [isConfirmModalOpen, setIsConfirmModalOpen] = useState(false);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const tenantId = params.get('id');

        if (!tenantId) {
          setError('Tautan portal tidak valid atau ID penghuni tidak ditemukan.');
          setLoading(false);
          return;
        }

        loadTenantData(tenantId);
      }, []);

      const loadTenantData = async (tenantId) => {
        try {
          const { data: tenantData, error: tErr } = await db
            .from('tenants')
            .select('*')
            .eq('id', tenantId)
            .single();

          if (tErr || !tenantData) throw new Error('Data penghuni tidak ditemukan di database.');
          setTenant(tenantData);

          const [roomRes, billsRes, complaintsRes] = await Promise.all([
            db.from('rooms').select('*').eq('id', tenantData.room_id).single(),
            db.from('bills').select('*').eq('tenant_id', tenantId).order('created_at', { ascending: false }),
            db.from('complaints').select('*').eq('tenant_id', tenantId).order('created_at', { ascending: false })
          ]);

          if (roomRes.data) setRoom(roomRes.data);
          if (billsRes.data) setBills(billsRes.data);
          if (complaintsRes.data) setComplaints(complaintsRes.data);
        } catch (err) {
          setError(err.message || 'Gagal memuat portal.');
        } finally {
          setLoading(false);
        }
      };

      const handleSendComplaint = async (e) => {
        e.preventDefault();
        setSavingComplaint(true);
        try {
          await db.from('complaints').insert([{
            room_id: room.id,
            tenant_id: tenant.id,
            title: newTitle,
            description: newDesc,
            category: 'fasilitas',
            status: 'pending'
          }]);
          setNewTitle('');
          setNewDesc('');
          alert('Keluhan berhasil dikirim ke pengelola!');
          loadTenantData(tenant.id);
        } catch (err) {
          alert('Gagal mengirim laporan: ' + err.message);
        } finally {
          setSavingComplaint(false);
        }
      };

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 text-slate-400 text-sm">
            Memuat portal pribadi Anda...
          </div>
        );
      }

      if (error) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 text-center space-y-3">
              <div className="w-12 h-12 bg-rose-950/60 border border-rose-800/50 text-rose-400 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold">
                ✕
              </div>
              <h2 className="text-base font-bold text-slate-100">Akses Ditolak</h2>
              <p className="text-xs text-slate-400 leading-relaxed">{error}</p>
              <p className="text-[11px] text-slate-500">Silakan hubungi pengelola kost untuk tautan resmi.</p>
            </div>
          </div>
        );
      }

      const latestBill = bills[0];
      const isPaid = latestBill?.payment_status === 'paid';

      const rent = Number(latestBill?.rent_amount || 0);
      const electric = Number(latestBill?.electric_cost || 0);
      const water = Number(latestBill?.water_cost || 0);
      const waste = Number(latestBill?.waste_cost || 0);
      const extra = Number(latestBill?.extra_guest_cost || 0);
      const totalAmount = rent + electric + water + waste + extra;

      return (
        <div className="min-h-screen bg-slate-950 text-slate-200 p-4 sm:p-6 max-w-xl mx-auto space-y-5">
          {/* Header Identitas Penghuni */}
          <header className="bg-slate-900 border border-slate-800 p-4 rounded-3xl flex justify-between items-center shadow-sm">
            <div>
              <span className="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">Penghuni Plawa Kost</span>
              <h2 className="text-base font-bold text-slate-100">{tenant.full_name}</h2>
              <p className="text-xs text-slate-400">Kamar {room?.room_number} • Jatuh Tempo Tiap Tgl {tenant.due_day}</p>
            </div>
            <div className="w-9 h-9 bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 font-black rounded-xl flex items-center justify-center text-sm">
              P
            </div>
          </header>

          {/* Navigasi Tab */}
          <div className="grid grid-cols-3 gap-1 bg-slate-900 p-1.5 rounded-2xl border border-slate-800 text-xs font-semibold">
            {[
              { id: 'bills', label: 'Tagihan' },
              { id: 'complaint', label: 'Komplain' },
              { id: 'info', label: 'Info Kost' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`py-2 rounded-xl transition ${
                  activeTab === tab.id
                    ? 'bg-slate-800 text-emerald-400 font-bold shadow-sm'
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* TAB 1: RINCIAN TAGIHAN */}
          {activeTab === 'bills' && (
            <div className="space-y-4">
              {latestBill ? (
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-sm">
                  <div className="flex justify-between items-start border-b border-slate-800 pb-3">
                    <div>
                      <span className="text-xs text-slate-400 font-medium">Tagihan Bulan Berjalan</span>
                      <p className="text-sm font-bold text-slate-200 mt-0.5">Periode {latestBill.billing_month}</p>
                    </div>
                    <span className={`text-[11px] font-bold px-2.5 py-1 rounded-full border ${
                      isPaid 
                        ? 'bg-emerald-950/60 text-emerald-300 border-emerald-800/50' 
                        : 'bg-amber-950/60 text-amber-300 border-amber-800/50'
                    }`}>
                      {isPaid ? '✓ Lunas' : 'Belum Lunas'}
                    </span>
                  </div>

                  {/* Komponen Rincian Tagihan */}
                  <div className="space-y-2 text-xs">
                    <div className="flex justify-between text-slate-300">
                      <span>• Sewa Pokok Kamar:</span>
                      <span>Rp {rent.toLocaleString('id-ID')}</span>
                    </div>
                    <div className="flex justify-between text-slate-300">
                      <span>• Listrik (Porsi Kamar):</span>
                      <span className="text-sky-400">Rp {electric.toLocaleString('id-ID')}</span>
                    </div>
                    <div className="flex justify-between text-slate-300">
                      <span>• Air (Dihitung Per Orang):</span>
                      <span className="text-teal-400">Rp {water.toLocaleString('id-ID')}</span>
                    </div>
                    <div className="flex justify-between text-slate-300">
                      <span>• Uang Sampah:</span>
                      <span>Rp {waste.toLocaleString('id-ID')}</span>
                    </div>
                    {extra > 0 && (
                      <div className="flex justify-between text-amber-300">
                        <span>• Tambahan Tamu Menginap:</span>
                        <span>Rp {extra.toLocaleString('id-ID')}</span>
                      </div>
                    )}
                  </div>

                  {/* Total Tagihan */}
                  <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                    <span className="text-xs font-bold text-slate-300">Total Tagihan:</span>
                    <span className="text-base font-black text-emerald-400">
                      Rp {totalAmount.toLocaleString('id-ID')}
                    </span>
                  </div>

                  {/* Tanda Tangan & Bukti yang sudah tersimpan */}
                  {(latestBill.signature_url || latestBill.proof_url) && (
                    <div className="bg-slate-950/60 border border-slate-800/80 p-3 rounded-2xl grid grid-cols-2 gap-3 text-[11px]">
                      {latestBill.proof_url && (
                        <div>
                          <span className="text-slate-400 block mb-1">Bukti Transfer:</span>
                          <a href={latestBill.proof_url} target="_blank" rel="noreferrer" className="block max-h-20 overflow-hidden rounded-lg border border-slate-800">
                            <img src={latestBill.proof_url} alt="Struk TF" className="object-cover w-full h-20" />
                          </a>
                        </div>
                      )}
                      {latestBill.signature_url && (
                        <div>
                          <span className="text-slate-400 block mb-1">Paraf / Tanda Tangan:</span>
                          <div className="max-h-20 overflow-hidden rounded-lg border border-slate-800 bg-slate-900 flex items-center justify-center p-1">
                            <img src={latestBill.signature_url} alt="Paraf Penghuni" className="max-h-16 object-contain" />
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {/* Aksi Pembayaran */}
                  <div className="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl space-y-3">
                    <p className="text-[11px] text-slate-400 font-medium">Rekening Tujuan Pembayaran:</p>
                    <div className="bg-slate-900 px-3 py-2 rounded-xl text-xs">
                      <p className="font-bold text-slate-200">{KOST_PAYMENT_INFO.bankName}: {KOST_PAYMENT_INFO.accountNumber}</p>
                      <p className="text-[10px] text-slate-400">a/n {KOST_PAYMENT_INFO.accountHolder}</p>
                    </div>

                    <button
                      onClick={() => setIsConfirmModalOpen(true)}
                      className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 transition shadow-md shadow-emerald-950"
                    >
                      <span>✍️ Upload Bukti TF & Tanda Tangan</span>
                    </button>
                  </div>
                </div>
              ) : (
                <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center text-slate-400 text-xs">
                  Belum ada invoice tagihan aktif untuk Anda.
                </div>
              )}
            </div>
          )}

          {/* TAB 2: TIKET KOMPLAIN */}
          {activeTab === 'complaint' && (
            <div className="space-y-4">
              <div className="bg-slate-900 border border-slate-800 p-5 rounded-3xl space-y-3">
                <h3 className="text-xs font-bold text-slate-100">Lapor Kerusakan / Fasilitas</h3>
                <form onSubmit={handleSendComplaint} className="space-y-3">
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 block mb-1">Judul Keluhan</label>
                    <input
                      type="text"
                      required
                      placeholder="Misal: Kran bocor / Lampu lorong mati"
                      value={newTitle}
                      onChange={(e) => setNewTitle(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                    />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 block mb-1">Keterangan Tambahan</label>
                    <textarea
                      rows="2"
                      placeholder="Penjelasan kerusakan..."
                      value={newDesc}
                      onChange={(e) => setNewDesc(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                    />
                  </div>
                  <button
                    type="submit"
                    disabled={savingComplaint}
                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl text-xs transition"
                  >
                    {savingComplaint ? 'Mengirim...' : 'Kirim Laporan'}
                  </button>
                </form>
              </div>

              <div className="space-y-2">
                <h4 className="text-xs font-bold text-slate-400 px-1">Riwayat Keluhan Anda</h4>
                {complaints.map(c => (
                  <div key={c.id} className="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl flex justify-between items-center text-xs">
                    <div>
                      <p className="font-bold text-slate-200">{c.title}</p>
                      <span className="text-[10px] text-slate-500">{new Date(c.created_at).toLocaleDateString('id-ID')}</span>
                    </div>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${
                      c.status === 'resolved' 
                        ? 'bg-emerald-950 text-emerald-300 border-emerald-800/40' 
                        : (c.status === 'in_progress' ? 'bg-sky-950 text-sky-300 border-sky-800/40' : 'bg-amber-950 text-amber-300 border-amber-800/40')
                    }`}>
                      {c.status === 'resolved' ? 'Selesai' : (c.status === 'in_progress' ? 'Dikerjakan' : 'Menunggu')}
                    </span>
                  </div>
                ))}
                {complaints.length === 0 && (
                  <p className="text-center py-6 text-xs text-slate-500">Belum ada komplain tercatat.</p>
                )}
              </div>
            </div>
          )}

          {/* TAB 3: INFORMASI KOST */}
          {activeTab === 'info' && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 text-xs">
              <h3 className="text-sm font-bold text-slate-100 border-b border-slate-800 pb-2">Informasi Umum Plawa Kost</h3>
              <div className="space-y-3">
                <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800/80">
                  <span className="text-[10px] font-bold text-emerald-400 uppercase">📶 Akses WiFi</span>
                  <p className="font-bold text-slate-200 mt-0.5">SSID: PlawaKost_Fast</p>
                  <p className="text-slate-400">Password: <code className="bg-slate-900 px-1.5 py-0.5 rounded text-slate-200">plawa12345</code></p>
                </div>
                <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800/80">
                  <span className="text-[10px] font-bold text-sky-400 uppercase">🗑️ Sampah Lingkungan</span>
                  <p className="text-slate-300 mt-0.5">Pengambilan sampah dilakukan setiap Selasa & Jumat pagi.</p>
                </div>
              </div>
            </div>
          )}

          {/* MODAL UPLOAD BUKTI TF & TANDA TANGAN */}
          {isConfirmModalOpen && latestBill && (
            <TenantConfirmModal
              bill={latestBill}
              tenant={tenant}
              room={room}
              onClose={() => setIsConfirmModalOpen(false)}
              onSuccess={() => {
                setIsConfirmModalOpen(false);
                loadTenantData(tenant.id);
              }}
            />
          )}
        </div>
      );
    }

    // MODAL INTERAKTIF: UPLOAD BUKTI TF & DRAWING PAD TANDA TANGAN
    function TenantConfirmModal({ bill, tenant, room, onClose, onSuccess }) {
      const [selectedFile, setSelectedFile] = useState(null);
      const [proofPreview, setProofPreview] = useState(bill.proof_url || null);
      const [saving, setSaving] = useState(false);

      // Canvas Tanda Tangan
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [hasSignature, setHasSignature] = useState(false);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.strokeStyle = '#38bdf8'; // Sky blue stroke
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
      }, []);

      const getCoordinates = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      };

      const startDrawing = (e) => {
        e.preventDefault();
        setIsDrawing(true);
        const { x, y } = getCoordinates(e);
        const ctx = canvasRef.current.getContext('2d');
        ctx.beginPath();
        ctx.moveTo(x, y);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        e.preventDefault();
        const { x, y } = getCoordinates(e);
        const ctx = canvasRef.current.getContext('2d');
        ctx.lineTo(x, y);
        ctx.stroke();
        setHasSignature(true);
      };

      const stopDrawing = () => {
        setIsDrawing(false);
      };

      const clearSignature = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        setHasSignature(false);
      };

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setSelectedFile(file);
        const reader = new FileReader();
        reader.onloadend = () => {
          setProofPreview(reader.result);
        };
        reader.readAsDataURL(file);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          let finalProofUrl = bill.proof_url;
          let finalSignatureUrl = bill.signature_url;

          // 1. Proses Upload Gambar Struk TF
          if (selectedFile) {
            try {
              const fileExt = selectedFile.name.split('.').pop();
              const fileName = `tf_${tenant.id}_${Date.now()}.${fileExt}`;
              const { data: uploadData, error: uploadErr } = await db.storage
                .from('receipts')
                .upload(fileName, selectedFile, { upsert: true });

              if (!uploadErr && uploadData) {
                const { data: urlData } = db.storage.from('receipts').getPublicUrl(fileName);
                finalProofUrl = urlData.publicUrl;
              } else {
                finalProofUrl = proofPreview;
              }
            } catch (err) {
              finalProofUrl = proofPreview;
            }
          }

          // 2. Ekstrak Data Gambar Tanda Tangan Canvas
          if (hasSignature && canvasRef.current) {
            finalSignatureUrl = canvasRef.current.toDataURL('image/png');
          }

          // 3. Simpan ke database
          await db.from('bills').update({
            proof_url: finalProofUrl,
            signature_url: finalSignatureUrl,
            payment_method: 'transfer'
          }).eq('id', bill.id);

          // 4. Buka WhatsApp konfirmasi otomatis ke Pengelola
          const total = Number(bill.rent_amount || 0) + Number(bill.electric_cost || 0) + Number(bill.water_cost || 0) + Number(bill.waste_cost || 0) + Number(bill.extra_guest_cost || 0);
          const text = `Halo Pengelola Plawa Kost, saya *${tenant.full_name}* (Kamar *${room?.room_number}*) telah membubuhkan tanda tangan & mengunggah bukti transfer sebesar *Rp ${total.toLocaleString('id-ID')}*. Mohon dicek ya kak, terima kasih! 🙏`;
          window.open(`https://wa.me/${KOST_PAYMENT_INFO.ownerWa}?text=${encodeURIComponent(text)}`, '_blank');

          alert('Konfirmasi bukti transfer & tanda tangan berhasil disimpan!');
          onSuccess();
        } catch (err) {
          alert('Gagal menyimpan: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 backdrop-blur-xs p-4 overflow-y-auto">
          <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-sm w-full p-5 shadow-2xl my-6 space-y-4">
            <div className="flex justify-between items-center pb-2 border-b border-slate-800">
              <h3 className="text-sm font-bold text-slate-100">Upload Bukti & Tanda Tangan</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-200 text-sm">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              {/* BAGIAN 1: UPLOAD BUKTI TRANSFER */}
              <div className="space-y-2">
                <label className="text-[11px] font-bold text-sky-400 block">
                  1. Foto / Struk Bukti Transfer (Transfer Bank / QRIS)
                </label>
                <input
                  type="file"
                  accept="image/*"
                  onChange={handleFileChange}
                  className="w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-[10px] file:font-bold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700 cursor-pointer"
                />

                {proofPreview && (
                  <div className="relative border border-slate-800 rounded-xl overflow-hidden max-h-32 flex items-center justify-center bg-slate-950">
                    <img src={proofPreview} alt="Preview Bukti" className="object-contain max-h-32 w-full" />
                    <button
                      type="button"
                      onClick={() => {
                        setSelectedFile(null);
                        setProofPreview(null);
                      }}
                      className="absolute top-1 right-1 bg-slate-950/80 text-rose-400 text-[10px] px-1.5 py-0.5 rounded"
                    >
                      Hapus
                    </button>
                  </div>
                )}
              </div>

              {/* BAGIAN 2: PAD TANDA TANGAN DIGITAL (CANVAS SENTUH) */}
              <div className="space-y-1.5">
                <div className="flex justify-between items-center">
                  <label className="text-[11px] font-bold text-emerald-400">
                    2. Bubuhkan Paraf / Tanda Tangan (Gores di layar)
                  </label>
                  <button
                    type="button"
                    onClick={clearSignature}
                    className="text-[10px] text-rose-400 hover:underline"
                  >
                    Hapus Ulang
                  </button>
                </div>

                <div className="border border-slate-700 bg-slate-950 rounded-2xl overflow-hidden touch-none flex justify-center">
                  <canvas
                    ref={canvasRef}
                    width={320}
                    height={130}
                    style={{ touchAction: 'none' }}
                    onPointerDown={startDrawing}
                    onPointerMove={draw}
                    onPointerUp={stopDrawing}
                    onPointerCancel={stopDrawing}
                    className="cursor-crosshair w-full"
                  />
                </div>
                <p className="text-[10px] text-slate-500 italic text-center">Gunakan jari atau stylus Anda di atas kotak hitam.</p>
              </div>

              {/* Tombol Simpan & Kirim */}
              <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-3.5 py-1.5 text-xs text-slate-400 hover:text-slate-200"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className="px-4 py-2 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl transition shadow-md shadow-emerald-950"
                >
                  {saving ? 'Menyimpan...' : 'Simpan & Kirim Konfirmasi'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

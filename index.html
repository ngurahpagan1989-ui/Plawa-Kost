<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plawa Kost Management</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel untuk compile JSX langsung di browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Masukkan kredensial Supabase kamu di sini
    const SUPABASE_URL = 'https://oqqrarwwbhxdpocaerog.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xcXJhcnd3Ymh4ZHBvY2Flcm9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMDI1NDksImV4cCI6MjEwNjY3ODU0OX0.XHVPjy01DZHo5uKhGZyClA-Jr6nKeqQi4FajatbSZKI';

// Di browser (window.supabase):
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const [tab, setTab] = useState('rooms');
      const [rooms, setRooms] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetchRooms();
      }, []);

      async function fetchRooms() {
        setLoading(true);
        const { data, error } = await supabase.from('rooms').select('*').order('room_number');
        if (!error && data) setRooms(data);
        setLoading(false);
      }

      return (
        <div className="min-h-screen">
          <header className="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-10">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
              <h1 className="text-xl font-bold text-slate-900">Plawa Kost Management</h1>
              <nav className="flex space-x-1 bg-slate-100 p-1 rounded-xl">
                {['rooms', 'tenants', 'billing', 'expenses'].map((t) => (
                  <button
                    key={t}
                    onClick={() => setTab(t)}
                    className={`px-4 py-2 rounded-lg text-sm font-medium capitalize transition-colors ${
                      tab === t ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    {t === 'rooms' ? 'Denah Kamar' : t === 'tenants' ? 'Penyewa' : t === 'billing' ? 'Tagihan' : 'Pengeluaran'}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          <main className="max-w-6xl mx-auto p-6">
            {tab === 'rooms' && (
              <div>
                <h2 className="text-lg font-semibold mb-4">Daftar Kamar ({rooms.length})</h2>
                {loading ? (
                  <p className="text-slate-500">Memuat data kamar...</p>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    {rooms.map((room) => (
                      <div key={room.id} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <div className="flex justify-between items-center mb-2">
                          <span className="text-xl font-bold">Kamar {room.room_number}</span>
                          <span className={`text-xs px-2.5 py-1 rounded-full font-medium ${
                            room.status === 'occupied' ? 'bg-blue-100 text-blue-800' : 'bg-emerald-100 text-emerald-800'
                          }`}>
                            {room.status === 'occupied' ? 'Terisi' : 'Kosong'}
                          </span>
                        </div>
                        <p className="text-sm text-slate-600">Rp {Number(room.monthly_price).toLocaleString('id-ID')} / bulan</p>
                      </div>
                    ))}
                    {rooms.length === 0 && <p className="text-slate-400">Belum ada data kamar di database.</p>}
                  </div>
                )}
              </div>
            )}
            {tab !== 'rooms' && (
              <div className="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-500">
                Fitur {tab} siap dihubungkan.
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

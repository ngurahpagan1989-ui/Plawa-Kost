<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-600 selection:text-white min-h-screen">
  <div id="root"></div>

  <!-- SCRIPT APLIKASI UTAMA (REACT + BABEL) -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==============================================================================
    // KONFIGURASI SUPABASE CLIENT
    // ==============================================================================
    // Masukkan kredensial Supabase Anda di bawah ini, atau gunakan tombol "Koneksi Supabase" di antarmuka
    const DEFAULT_SUPABASE_URL = "https://your-project-id.supabase.co";
    const DEFAULT_SUPABASE_ANON_KEY = "your-anon-key-here";

    // Ambil konfigurasi dari localStorage jika pernah disimpan melalui modal UI
    const SAVED_URL = localStorage.getItem('PLAWA_SUPABASE_URL') || DEFAULT_SUPABASE_URL;
    const SAVED_KEY = localStorage.getItem('PLAWA_SUPABASE_KEY') || DEFAULT_SUPABASE_ANON_KEY;

    const isLiveSupabase = Boolean(
      SAVED_URL && 
      SAVED_KEY && 
      !SAVED_URL.includes('your-project-id') && 
      SAVED_URL.startsWith('http')
    );

    // Inisialisasi Supabase Client resmi
    let supabaseClient = null;
    if (isLiveSupabase && window.supabase && window.supabase.createClient) {
      try {
        supabaseClient = window.supabase.createClient(SAVED_URL, SAVED_KEY);
      } catch (err) {
        console.warn('Gagal menghubungkan ke Supabase Cloud, fallback ke penyimpanan lokal:', err);
      }
    }

    // ==============================================================================
    // LOCAL STORAGE MOCK ENGINE (Agar web 100% interaktif saat preview / sebelum isi .env)
    // ==============================================================================
    const MOCK_ROOMS = [
      { id: 'r101', room_number: '101', monthly_price: 1500000, status: 'occupied' },
      { id: 'r102', room_number: '102', monthly_price: 1500000, status: 'occupied' },
      { id: 'r103', room_number: '103', monthly_price: 1500000, status: 'empty' },
      { id: 'r104', room_number: '104', monthly_price: 1600000, status: 'occupied' },
      { id: 'r105', room_number: '105', monthly_price: 1600000, status: 'maintenance' },
      { id: 'r201', room_number: '201', monthly_price: 1750000, status: 'occupied' },
      { id: 'r202', room_number: '202', monthly_price: 1750000, status: 'empty' },
      { id: 'r203', room_number: '203', monthly_price: 1750000, status: 'occupied' },
      { id: 'r204', room_number: '204', monthly_price: 1850000, status: 'empty' },
      { id: 'r205', room_number: '205', monthly_price: 1850000, status: 'occupied' },
    ];

    const MOCK_TENANTS = [
      { id: 't1', room_id: 'r101', full_name: 'I Made Bagus Wira', phone: '081234567890', entry_date: '2026-08-01', due_day: 1, is_active: true },
      { id: 't2', room_id: 'r102', full_name: 'Ni Putu Ayu Saraswati', phone: '081987654321', entry_date: '2026-08-05', due_day: 5, is_active: true },
      { id: 't3', room_id: 'r104', full_name: 'Dimas Prasetyo', phone: '085712345678', entry_date: '2026-08-10', due_day: 10, is_active: true },
      { id: 't4', room_id: 'r201', full_name: 'Rian Hidayat', phone: '082198761234', entry_date: '2026-09-01', due_day: 1, is_active: true },
      { id: 't5', room_id: 'r203', full_name: 'Kadek Dwi Cahyani', phone: '087812349876', entry_date: '2026-09-15', due_day: 15, is_active: true },
      { id: 't6', room_id: 'r205', full_name: 'Budi Santoso', phone: '081399887766', entry_date: '2026-09-20', due_day: 20, is_active: true },
    ];

    const MOCK_BILLS = [
      { id: 'b1', tenant_id: 't1', room_id: 'r101', billing_month: '2026-10', rent_amount: 1500000, utility_cost: 125000, total_amount: 1625000, payment_status: 'paid', paid_at: '2026-10-01T10:30:00Z', notes: 'Listrik: 50 kWh @ Rp 2.500. Transfer BCA' },
      { id: 'b2', tenant_id: 't2', room_id: 'r102', billing_month: '2026-10', rent_amount: 1500000, utility_cost: 0, total_amount: 1500000, payment_status: 'unpaid', paid_at: null, notes: 'Tagihan bulan berjalan' },
      { id: 'b3', tenant_id: 't3', room_id: 'r104', billing_month: '2026-10', rent_amount: 1600000, utility_cost: 85000, total_amount: 1685000, payment_status: 'unpaid', paid_at: null, notes: 'Listrik: (1450 - 1416) = 34 kWh @ Rp 2.500' },
      { id: 'b4', tenant_id: 't4', room_id: 'r201', billing_month: '2026-10', rent_amount: 1750000, utility_cost: 150000, total_amount: 1900000, payment_status: 'paid', paid_at: '2026-10-02T14:15:00Z', notes: 'Lunas tunai' },
      { id: 'b5', tenant_id: 't5', room_id: 'r203', billing_month: '2026-10', rent_amount: 1750000, utility_cost: 0, total_amount: 1750000, payment_status: 'unpaid', paid_at: null, notes: 'Jatuh tempo tgl 15' },
      { id: 'b6', tenant_id: 't6', room_id: 'r205', billing_month: '2026-10', rent_amount: 1850000, utility_cost: 0, total_amount: 1850000, payment_status: 'unpaid', paid_at: null, notes: 'Jatuh tempo tgl 20' },
    ];

    const MOCK_EXPENSES = [
      { id: 'e1', category: 'wifi', amount: 450000, expense_date: '2026-10-01', description: 'WiFi Indihome 100Mbps Oktober' },
      { id: 'e2', category: 'sampah', amount: 75000, expense_date: '2026-10-02', description: 'Iuran kebersihan Banjar Plawa' },
      { id: 'e3', category: 'listrik_umum', amount: 200000, expense_date: '2026-10-03', description: 'Token listrik pompa air & koridor' },
      { id: 'e4', category: 'perbaikan', amount: 180000, expense_date: '2026-10-04', description: 'Ganti kran & selang kamar 105' },
      { id: 'e5', category: 'lainnya', amount: 65000, expense_date: '2026-10-04', description: 'Beli sabun pel & pengharum lantai' },
    ];

    function getStorage(key, defaultVal) {
      const data = localStorage.getItem(`plawa_sp_${key}`);
      return data ? JSON.parse(data) : defaultVal;
    }

    function setStorage(key, val) {
      localStorage.setItem(`plawa_sp_${key}`, JSON.stringify(val));
    }

    // Database Service Layer yang mendukung Supabase Cloud & Local Storage
    const db = {
      async getRooms() {
        if (supabaseClient) {
          const { data, error } = await supabaseClient
            .from('rooms')
            .select('*, tenants(id, full_name, phone, entry_date, is_active)')
            .order('room_number', { ascending: true });
          if (!error && data) return data;
        }
        const rooms = getStorage('rooms', MOCK_ROOMS);
        const tenants = getStorage('tenants', MOCK_TENANTS);
        return rooms.map(r => ({
          ...r,
          tenants: tenants.filter(t => t.room_id === r.id && t.is_active)
        }));
      },

      async getTenants() {
        if (supabaseClient) {
          const { data, error } = await supabaseClient
            .from('tenants')
            .select('*, rooms(id, room_number, monthly_price)')
            .eq('is_active', true)
            .order('created_at', { ascending: false });
          if (!error && data) return data;
        }
        const tenants = getStorage('tenants', MOCK_TENANTS);
        const rooms = getStorage('rooms', MOCK_ROOMS);
        return tenants.filter(t => t.is_active).map(t => ({
          ...t,
          rooms: rooms.find(r => r.id === t.room_id) || null
        }));
      },

      async getBills() {
        if (supabaseClient) {
          const { data, error } = await supabaseClient
            .from('bills')
            .select('*, tenants(id, full_name, phone), rooms(id, room_number)')
            .order('created_at', { ascending: false });
          if (!error && data) return data;
        }
        const bills = getStorage('bills', MOCK_BILLS);
        const tenants = getStorage('tenants', MOCK_TENANTS);
        const rooms = getStorage('rooms', MOCK_ROOMS);
        return bills.map(b => ({
          ...b,
          tenants: tenants.find(t => t.id === b.tenant_id) || null,
          rooms: rooms.find(r => r.id === b.room_id) || null
        }));
      },

      async getExpenses() {
        if (supabaseClient) {
          const { data, error } = await supabaseClient
            .from('expenses')
            .select('*')
            .order('expense_date', { ascending: false });
          if (!error && data) return data;
        }
        return getStorage('expenses', MOCK_EXPENSES);
      },

      async checkInTenant({ roomId, fullName, phone, entryDate, dueDay }) {
        if (supabaseClient) {
          // 1. Insert tenant
          const { data: tenant, error: tErr } = await supabaseClient
            .from('tenants')
            .insert([{ room_id: roomId, full_name: fullName, phone, entry_date: entryDate, due_day: parseInt(dueDay), is_active: true }])
            .select()
            .single();
          if (tErr) throw tErr;

          // 2. Update room status
          await supabaseClient.from('rooms').update({ status: 'occupied' }).eq('id', roomId);

          // 3. Ambil data kamar untuk harga sewa
          const { data: roomData } = await supabaseClient.from('rooms').select('monthly_price').eq('id', roomId).single();
          const price = roomData ? roomData.monthly_price : 0;

          // 4. Buat tagihan bulan pertama
          await supabaseClient.from('bills').insert([{
            tenant_id: tenant.id,
            room_id: roomId,
            billing_month: entryDate.slice(0, 7),
            rent_amount: price,
            utility_cost: 0,
            total_amount: price,
            payment_status: 'unpaid',
            notes: `Tagihan sewa bulan pertama (${entryDate})`
          }]);
          return;
        }

        // Local Storage Simulation
        const rooms = getStorage('rooms', MOCK_ROOMS);
        const targetRoom = rooms.find(r => r.id === roomId);
        const newTenantId = 't_' + Date.now();
        const newTenant = {
          id: newTenantId,
          room_id: roomId,
          full_name: fullName,
          phone,
          entry_date: entryDate,
          due_day: parseInt(dueDay),
          is_active: true
        };

        // Update rooms
        const updatedRooms = rooms.map(r => r.id === roomId ? { ...r, status: 'occupied' } : r);
        setStorage('rooms', updatedRooms);

        // Update tenants
        const tenants = getStorage('tenants', MOCK_TENANTS);
        setStorage('tenants', [newTenant, ...tenants]);

        // Create initial bill
        const bills = getStorage('bills', MOCK_BILLS);
        const newBill = {
          id: 'b_' + Date.now(),
          tenant_id: newTenantId,
          room_id: roomId,
          billing_month: entryDate.slice(0, 7),
          rent_amount: targetRoom ? targetRoom.monthly_price : 0,
          utility_cost: 0,
          total_amount: targetRoom ? targetRoom.monthly_price : 0,
          payment_status: 'unpaid',
          paid_at: null,
          notes: `Tagihan sewa bulan pertama (${entryDate})`
        };
        setStorage('bills', [newBill, ...bills]);
      },

      async checkoutTenant(tenant) {
        if (supabaseClient) {
          await supabaseClient.from('tenants').update({ is_active: false }).eq('id', tenant.id);
          if (tenant.room_id) {
            await supabaseClient.from('rooms').update({ status: 'empty' }).eq('id', tenant.room_id);
          }
          return;
        }

        const tenants = getStorage('tenants', MOCK_TENANTS);
        const updatedTenants = tenants.map(t => t.id === tenant.id ? { ...t, is_active: false } : t);
        setStorage('tenants', updatedTenants);

        if (tenant.room_id) {
          const rooms = getStorage('rooms', MOCK_ROOMS);
          const updatedRooms = rooms.map(r => r.id === tenant.room_id ? { ...r, status: 'empty' } : r);
          setStorage('rooms', updatedRooms);
        }
      },

      async markBillPaid(billId) {
        const nowIso = new Date().toISOString();
        if (supabaseClient) {
          await supabaseClient.from('bills').update({ payment_status: 'paid', paid_at: nowIso }).eq('id', billId);
          return;
        }
        const bills = getStorage('bills', MOCK_BILLS);
        const updated = bills.map(b => b.id === billId ? { ...b, payment_status: 'paid', paid_at: nowIso } : b);
        setStorage('bills', updated);
      },

      async updateBillUtility(billId, utilityCost, totalAmount, notes) {
        if (supabaseClient) {
          await supabaseClient.from('bills').update({ utility_cost: utilityCost, total_amount: totalAmount, notes }).eq('id', billId);
          return;
        }
        const bills = getStorage('bills', MOCK_BILLS);
        const updated = bills.map(b => b.id === billId ? { ...b, utility_cost: utilityCost, total_amount: totalAmount, notes } : b);
        setStorage('bills', updated);
      },

      async addExpense(category, amount, expenseDate, description) {
        if (supabaseClient) {
          await supabaseClient.from('expenses').insert([{ category, amount, expense_date: expenseDate, description }]);
          return;
        }
        const expenses = getStorage('expenses', MOCK_EXPENSES);
        const newExp = {
          id: 'e_' + Date.now(),
          category,
          amount: Number(amount),
          expense_date: expenseDate,
          description
        };
        setStorage('expenses', [newExp, ...expenses]);
      }
    };

    // ==============================================================================
    // KOMPONEN MODAL KALKULATOR UTILITAS
    // ==============================================================================
    function UtilityModal({ isOpen, bill, onClose, onSave }) {
      const [prevM, setPrevM] = useState(0);
      const [currM, setCurrM] = useState(0);
      const [rate, setRate] = useState(2500);

      useEffect(() => {
        if (bill) {
          setPrevM(0);
          setCurrM(0);
          setRate(2500);
        }
      }, [bill, isOpen]);

      if (!isOpen || !bill) return null;

      const usage = Math.max(0, Number(currM) - Number(prevM));
      const cost = usage * Number(rate);
      const rent = Number(bill.rent_amount || 0);
      const total = rent + cost;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
          <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-100">
            <div className="flex justify-between items-center pb-3 border-b border-slate-100">
              <div>
                <h3 className="text-base font-bold text-slate-900">⚡ Kalkulator Listrik</h3>
                <p className="text-xs text-slate-500">Kamar {bill.rooms?.room_number} • {bill.tenants?.full_name}</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <div className="mt-4 space-y-3 text-xs">
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="font-semibold text-slate-700 block mb-1">Meter Awal (kWh)</label>
                  <input type="number" min="0" value={prevM} onChange={e => setPrevM(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800" />
                </div>
                <div>
                  <label className="font-semibold text-slate-700 block mb-1">Meter Akhir (kWh)</label>
                  <input type="number" min="0" value={currM} onChange={e => setCurrM(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800" />
                </div>
              </div>

              <div>
                <label className="font-semibold text-slate-700 block mb-1">Tarif per kWh (Rp)</label>
                <input type="number" min="0" value={rate} onChange={e => setRate(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800" />
              </div>

              <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-1.5">
                <div className="flex justify-between">
                  <span>Pemakaian Listrik:</span>
                  <span className="font-bold text-slate-900">{usage} kWh</span>
                </div>
                <div className="flex justify-between text-amber-700 font-semibold">
                  <span>Biaya Tambahan:</span>
                  <span>+ Rp {cost.toLocaleString('id-ID')}</span>
                </div>
                <div className="border-t border-slate-200 pt-1.5 flex justify-between font-extrabold text-slate-900">
                  <span>Total Tagihan Baru:</span>
                  <span className="text-blue-700">Rp {total.toLocaleString('id-ID')}</span>
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button type="button" onClick={onClose} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-xl">Batal</button>
                <button
                  type="button"
                  onClick={() => {
                    const notes = `Listrik: (${currM} - ${prevM}) = ${usage} kWh @ Rp ${Number(rate).toLocaleString('id-ID')}`;
                    onSave(bill.id, cost, total, notes);
                  }}
                  className="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl shadow-xs"
                >
                  Terapkan ke Tagihan
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==============================================================================
    // KOMPONEN UI UTAMA
    // ==============================================================================

    function App() {
      const [activeTab, setActiveTab] = useState('rooms');
      const [rooms, setRooms] = useState([]);
      const [tenants, setTenants] = useState([]);
      const [bills, setBills] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [loading, setLoading] = useState(true);

      // Modal states
      const [isCheckInOpen, setIsCheckInOpen] = useState(false);
      const [selectedRoomForCheckIn, setSelectedRoomForCheckIn] = useState('');
      const [isUtilityOpen, setIsUtilityOpen] = useState(false);
      const [selectedBillForUtility, setSelectedBillForUtility] = useState(null);
      const [isConfigOpen, setIsConfigOpen] = useState(false);

      // Refresh seluruh data
      async function loadAllData() {
        setLoading(true);
        try {
          const [r, t, b, e] = await Promise.all([
            db.getRooms(),
            db.getTenants(),
            db.getBills(),
            db.getExpenses()
          ]);
          setRooms(r);
          setTenants(t);
          setBills(b);
          setExpenses(e);
        } catch (err) {
          console.error('Error load data:', err);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => {
        loadAllData();
      }, []);

      // Statistik Okupansi
      const totalRooms = rooms.length;
      const occupiedRooms = rooms.filter(r => r.status === 'occupied').length;
      const emptyRooms = rooms.filter(r => r.status === 'empty').length;
      const maintenanceRooms = rooms.filter(r => r.status === 'maintenance').length;
      const occupancyRate = totalRooms > 0 ? Math.round((occupiedRooms / totalRooms) * 100) : 0;

      // Status Badge Style
      const statusBadge = {
        empty: { label: 'Kosong', bg: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
        occupied: { label: 'Terisi', bg: 'bg-blue-50 text-blue-700 border-blue-200' },
        maintenance: { label: 'Perbaikan', bg: 'bg-amber-50 text-amber-700 border-amber-200' }
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800">
          {/* 1. HEADER & NAVBAR */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-6xl mx-auto px-4 sm:px-6">
              <div className="py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-slate-900 to-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-md">
                      🏠
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <h1 className="text-xl font-black text-slate-900 tracking-tight">Plawa Kost</h1>
                        <span className="text-[10px] font-bold uppercase tracking-wider bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full border border-blue-200">
                          Single File Edition
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 font-medium">Property Management & Billing System</p>
                    </div>
                  </div>

                  <button
                    onClick={() => setIsConfigOpen(true)}
                    className="sm:hidden text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-xl border border-slate-200 flex items-center gap-1 font-semibold"
                  >
                    <span>⚙️ Database</span>
                  </button>
                </div>

                <div className="flex items-center gap-3">
                  <div className={`hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl border text-xs font-semibold ${
                    isLiveSupabase ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-amber-50 text-amber-800 border-amber-200'
                  }`}>
                    <span className={`w-2 h-2 rounded-full ${isLiveSupabase ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`} />
                    <span>{isLiveSupabase ? 'Supabase Cloud Connected' : 'Demo Mode (Local Storage)'}</span>
                  </div>

                  <button
                    onClick={() => setIsConfigOpen(true)}
                    className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold border border-slate-200 transition"
                  >

                      </div>

                      {/* Riwayat Pengeluaran */}
                      <div className="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
                        <div className="flex justify-between items-center pb-3 border-b border-slate-100">
                          <h3 className="text-base font-bold text-slate-900">Riwayat Pengeluaran Operasional</h3>
                          <span className="text-xs text-slate-400">{expenses.length} data</span>
                        </div>

                        <div className="divide-y divide-slate-100 max-h-[480px] overflow-y-auto">
                          {expenses.map(item => (
                            <div key={item.id} className="py-3 flex justify-between items-start gap-4">
                              <div>
                                <div className="flex items-center gap-2">
                                  <span className="text-xs font-bold text-slate-900 uppercase">
                                    {item.category.replace('_', ' ')}
                                  </span>
                                  <span className="text-[10px] text-slate-400 font-mono bg-slate-100 px-1.5 py-0.5 rounded">
                                    {item.expense_date}
                                  </span>
                                </div>
                                <p className="text-xs text-slate-600 mt-0.5">{item.description || '-'}</p>
                              </div>
                              <span className="text-sm font-extrabold text-rose-600 whitespace-nowrap">
                                - Rp {Number(item.amount).toLocaleString('id-ID')}
                              </span>
                            </div>
                          ))}
                          {expenses.length === 0 && (
                            <p className="text-center py-10 text-xs text-slate-400">Belum ada catatan kas keluar.</p>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </>
            )}
          </main>

          {/* 3. FOOTER */}
          <footer className="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-500">
            <div className="max-w-6xl mx-auto px-4">
              <p className="font-bold text-slate-800">Plawa Kost — Property Management System</p>
              <p className="mt-1 text-slate-400">Single File Edition • Zero-Config GitHub Pages Deployment</p>
            </div>
          </footer>

          {/* ============================================================== */}
          {/* MODAL 1: CHECK-IN PENYEWA */}
          {/* ============================================================== */}
          {isCheckInOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
                <div className="flex justify-between items-center pb-3 border-b border-slate-100">
                  <h3 className="text-base font-bold text-slate-900">Check-In Penyewa Baru</h3>
                  <button onClick={() => setIsCheckInOpen(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>

                <form
                  onSubmit={async (e) => {
                    e.preventDefault();
                    const form = e.target;
                    const roomId = form.room_id.value;
                    const fullName = form.full_name.value;
                    const phone = form.phone.value;
                    const entryDate = form.entry_date.value;
                    const dueDay = form.due_day.value;

                    if (!roomId) return alert('Silakan pilih kamar kosong');

                    await db.checkInTenant({ roomId, fullName, phone, entryDate, dueDay });
                    setIsCheckInOpen(false);
                    loadAllData();
                  }}
                  className="mt-4 space-y-3 text-xs"
                >
                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Pilih Kamar Kosong</label>
                    <select
                      name="room_id"
                      required
                      defaultValue={selectedRoomForCheckIn}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800"
                    >
                      <option value="">-- Pilih Kamar --</option>
                      {rooms.filter(r => r.status === 'empty').map(r => (
                        <option key={r.id} value={r.id}>
                          Kamar {r.room_number} — Rp {Number(r.monthly_price).toLocaleString('id-ID')}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Nama Lengkap Penghuni</label>
                    <input type="text" name="full_name" required placeholder="Contoh: I Made Bagus Wira" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800" />
                  </div>

                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Nomor WhatsApp / HP</label>
                    <input type="tel" name="phone" required placeholder="Contoh: 081234567890" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-semibold text-slate-700 block mb-1">Tanggal Masuk</label>
                      <input type="date" name="entry_date" required defaultValue={new Date().toISOString().split('T')[0]} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800" />
                    </div>
                    <div>
                      <label className="font-semibold text-slate-700 block mb-1">Jatuh Tempo (Tgl)</label>
                      <input type="number" name="due_day" min="1" max="31" required defaultValue={new Date().getDate()} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800" />
                    </div>
                  </div>

                  <div className="p-3 bg-blue-50 text-blue-900 rounded-xl border border-blue-200 mt-2">
                    <p className="font-semibold">Otomatisasi Tagihan:</p>
                    <p className="text-[11px] text-blue-700 mt-0.5">Status kamar akan otomatis menjadi 'Terisi' dan draf tagihan bulan pertama akan otomatis terbit.</p>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onClick={() => setIsCheckInOpen(false)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-xl">Batal</button>
                    <button type="submit" className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-xs">Simpan & Check-in</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ============================================================== */}
          {/* MODAL 2: KALKULATOR UTILITAS LISTRIK/AIR */}
          {/* ============================================================== */}
          <UtilityModal
            isOpen={isUtilityOpen}
            bill={selectedBillForUtility}
            onClose={() => setIsUtilityOpen(false)}
            onSave={async (billId, cost, total, notes) => {
              await db.updateBillUtility(billId, cost, total, notes);
              setIsUtilityOpen(false);
              loadAllData();
            }}
          />

          {/* ============================================================== */}
          {/* MODAL 3: SETUP KONEKSI SUPABASE */}
          {/* ============================================================== */}
          {isConfigOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 text-xs">
                <div className="flex justify-between items-center pb-3 border-b border-slate-100">
                  <h3 className="text-base font-bold text-slate-900">⚙️ Pengaturan Supabase Cloud</h3>
                  <button onClick={() => setIsConfigOpen(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>

                <div className="mt-3 p-3 rounded-xl border bg-slate-50 text-slate-600">
                  <p className="font-bold text-slate-800">Status Saat Ini:</p>
                  <p className="mt-1">{isLiveSupabase ? '🟢 Terhubung ke Supabase Cloud' : '🟡 Mode Demo / Local Storage Browser'}</p>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    const url = form.url.value.trim();
                    const key = form.key.value.trim();
                    if (url && key) {
                      localStorage.setItem('PLAWA_SUPABASE_URL', url);
                      localStorage.setItem('PLAWA_SUPABASE_KEY', key);
                      alert('Konfigurasi disimpan! Halaman akan dimuat ulang.');
                      window.location.reload();
                    }
                  }}
                  className="mt-3 space-y-3"
                >
                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Project URL Supabase</label>
                    <input type="url" name="url" required defaultValue={SAVED_URL.includes('your-project-id') ? '' : SAVED_URL} placeholder="https://xyzcompany.supabase.co" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 font-mono text-[11px]" />
                  </div>

                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Project Anon Key</label>
                    <input type="password" name="key" required defaultValue={SAVED_KEY.includes('your-anon-key') ? '' : SAVED_KEY} placeholder="eyJhbGciOiJIUzI1NiIsInR..." className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 font-mono text-[11px]" />
                  </div>

                  <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-1 text-slate-600">
                    <p className="font-bold text-slate-800">Panduan SQL Schema:</p>
                    <p>Jalankan seluruh query dari berkas <span className="font-mono text-emerald-700 bg-emerald-50 px-1 py-0.5 rounded font-bold">supabase_schema.sql</span> di SQL Editor Supabase Anda.</p>
                  </div>

                  <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => {
                        if (confirm('Reset ke mode demo lokal?')) {
                          localStorage.removeItem('PLAWA_SUPABASE_URL');
                          localStorage.removeItem('PLAWA_SUPABASE_KEY');
                          localStorage.clear();
                          window.location.reload();
                        }
                      }}
                      className="text-rose-600 hover:underline"
                    >
                      Reset Demo
                    </button>
                    <div className="flex gap-2">
                      <button type="button" onClick={() => setIsConfigOpen(false)} className="px-3 py-1.5 text-slate-600 hover:bg-slate-100 rounded-xl">Tutup</button>
                      <button type="submit" className="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-xs">Simpan & Sambungkan</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render ke DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

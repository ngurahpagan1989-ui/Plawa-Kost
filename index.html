<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plawa Kost Management</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone (Compiler JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-200 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Inisialisasi Supabase
    const SUPABASE_URL = 'https://oqqrarwwbhxdpocaerog.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xcXJhcnd3Ymh4ZHBvY2Flcm9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMDI1NDksImV4cCI6MjEwNjY3ODU0OX0.XHVPjy01DZHo5uKhGZyClA-Jr6nKeqQi4FajatbSZKI';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const [activeTab, setActiveTab] = useState('rooms');
      const [rooms, setRooms] = useState([]);
      const [tenants, setTenants] = useState([]);
      const [bills, setBills] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [loading, setLoading] = useState(true);

      // State Modals
      const [isAddTenantOpen, setIsAddTenantOpen] = useState(false);
      const [isAddRoomOpen, setIsAddRoomOpen] = useState(false);
      const [selectedBillForUtility, setSelectedBillForUtility] = useState(null);

      const loadAllData = async () => {
        setLoading(true);
        try {
          const [roomsRes, tenantsRes, billsRes, expensesRes] = await Promise.all([
            db.from('rooms').select('*').order('room_number'),
            db.from('tenants').select('*').eq('is_active', true).order('created_at', { ascending: false }),
            db.from('bills').select('*').order('created_at', { ascending: false }),
            db.from('expenses').select('*').order('expense_date', { ascending: false })
          ]);

          if (roomsRes.data) setRooms(roomsRes.data);
          if (tenantsRes.data) setTenants(tenantsRes.data);
          if (billsRes.data) setBills(billsRes.data);
          if (expensesRes.data) setExpenses(expensesRes.data);
        } catch (err) {
          console.error("Gagal membaca database:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadAllData();
      }, []);

      const navItems = [
        { id: 'rooms', label: 'Denah Kamar', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
        { id: 'tenants', label: 'Penyewa', icon: 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z' },
        { id: 'billing', label: 'Tagihan & Kas Masuk', icon: 'M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2z' },
        { id: 'expenses', label: 'Kas Pengeluaran', icon: 'M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z' }
      ];

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-slate-950 text-slate-300">
          {/* SIDEBAR KIRI */}
          <aside className="w-full md:w-64 bg-slate-900/90 border-b md:border-b-0 md:border-r border-slate-800/80 p-5 flex flex-col shrink-0">
            {/* Logo / Branding */}
            <div className="flex items-center gap-3 mb-8">
              <div className="w-10 h-10 rounded-xl bg-emerald-600/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-black text-lg">
                P
              </div>
              <div>
                <h1 className="text-base font-bold text-slate-100 tracking-wide">Plawa Kost</h1>
                <p className="text-xs text-slate-400">Panel Pengelola</p>
              </div>
            </div>

            {/* Menu Navigasi */}
            <nav className="flex md:flex-col gap-1.5 overflow-x-auto md:overflow-visible pb-2 md:pb-0">
              {navItems.map((item) => {
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                      isActive
                        ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                    }`}
                  >
                    <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={item.icon}></path>
                    </svg>
                    {item.label}
                  </button>
                );
              })}
            </nav>

            <div className="mt-auto hidden md:block pt-6 border-t border-slate-800/60">
              <div className="text-[11px] text-slate-400 leading-relaxed">
                Status DB: <span className="text-emerald-400 font-medium">Terhubung</span>
              </div>
            </div>
          </aside>

          {/* KONTEN UTAMA */}
          <main className="flex-1 p-5 md:p-8 overflow-y-auto">
            {loading ? (
              <div className="flex items-center justify-center py-32 text-slate-400 text-sm">
                Memuat data properti...
              </div>
            ) : (
              <div className="max-w-5xl mx-auto space-y-6">
                {activeTab === 'rooms' && (
                  <RoomsView 
                    rooms={rooms} 
                    tenants={tenants} 
                    onOpenAddRoom={() => setIsAddRoomOpen(true)}
                  />
                )}
                {activeTab === 'tenants' && (
                  <TenantsView 
                    tenants={tenants} 
                    rooms={rooms} 
                    onOpenCheckIn={() => setIsAddTenantOpen(false || true)} 
                    refresh={loadAllData}
                  />
                )}
                {activeTab === 'billing' && (
                  <BillingView 
                    bills={bills} 
                    tenants={tenants} 
                    rooms={rooms} 
                    onOpenUtility={(bill) => setSelectedBillForUtility(bill)} 
                    refresh={loadAllData}
                  />
                )}
                {activeTab === 'expenses' && (
                  <ExpensesView 
                    expenses={expenses} 
                    refresh={loadAllData}
                  />
                )}
              </div>
            )}
          </main>

          {/* MODALS */}
          {isAddRoomOpen && (
            <AddRoomModal 
              onClose={() => setIsAddRoomOpen(false)} 
              refresh={loadAllData} 
            />
          )}
          {isAddTenantOpen && (
            <AddTenantModal 
              rooms={rooms.filter(r => r.status === 'empty')} 
              onClose={() => setIsAddTenantOpen(false)} 
              refresh={loadAllData} 
            />
          )}
          {selectedBillForUtility && (
            <UtilityModal 
              bill={selectedBillForUtility} 
              onClose={() => setSelectedBillForUtility(null)} 
              refresh={loadAllData} 
            />
          )}
        </div>
      );
    }

    // 1. TAB DENAH KAMAR
    function RoomsView({ rooms, tenants, onOpenAddRoom }) {
      const total = rooms.length;
      const occupied = rooms.filter(r => r.status === 'occupied').length;
      const rate = total > 0 ? Math.round((occupied / total) * 100) : 0;

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-lg font-bold text-slate-100">Denah & Status Kamar</h2>
              <p className="text-xs text-slate-400">Pantau ketersediaan unit secara langsung</p>
            </div>
            <button
              onClick={onOpenAddRoom}
              className="bg-emerald-600/90 hover:bg-emerald-600 text-white text-xs font-semibold px-3.5 py-2 rounded-xl transition shadow-sm"
            >
              + Tambah Kamar
            </button>
          </div>

          {/* Statistik Unit */}
          <div className="grid grid-cols-3 gap-3">
            <div className="bg-slate-900 border border-slate-800/80 p-4 rounded-2xl">
              <span className="text-xs text-slate-400 font-medium">Total Kamar</span>
              <p className="text-xl font-bold text-slate-200 mt-1">{total}</p>
            </div>
            <div className="bg-slate-900 border border-slate-800/80 p-4 rounded-2xl">
              <span className="text-xs text-slate-400 font-medium">Terisi</span>
              <p className="text-xl font-bold text-sky-400 mt-1">{occupied}</p>
            </div>
            <div className="bg-slate-900 border border-slate-800/80 p-4 rounded-2xl">
              <span className="text-xs text-slate-400 font-medium">Tingkat Okupansi</span>
              <p className="text-xl font-bold text-emerald-400 mt-1">{rate}%</p>
            </div>
          </div>

          {/* Grid Kamar */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {rooms.map((room) => {
              const activeTenant = tenants.find(t => t.room_id === room.id);
              const isOccupied = room.status === 'occupied';

              return (
                <div key={room.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between h-44 shadow-sm hover:border-slate-700 transition">
                  <div>
                    <div className="flex justify-between items-start">
                      <span className="text-2xl font-black text-slate-100">Kamar {room.room_number}</span>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${
                        isOccupied 
                          ? 'bg-sky-950/60 text-sky-300 border-sky-800/50' 
                          : 'bg-emerald-950/60 text-emerald-300 border-emerald-800/50'
                      }`}>
                        {isOccupied ? 'Terisi' : 'Kosong'}
                      </span>
                    </div>
                    <p className="text-xs text-slate-400 mt-1">
                      Rp {Number(room.monthly_price).toLocaleString('id-ID')} / bln
                    </p>
                  </div>

                  <div className="border-t border-slate-800/80 pt-3">
                    {isOccupied && activeTenant ? (
                      <div>
                        <p className="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Penghuni</p>
                        <p className="text-xs font-bold text-slate-200 truncate">{activeTenant.full_name}</p>
                        <p className="text-[10px] text-slate-400">Jatuh Tempo: Tgl {activeTenant.due_day}</p>
                      </div>
                    ) : (
                      <p className="text-xs text-slate-400 italic">Siap disewakan</p>
                    )}
                  </div>
                </div>
              );
            })}
            {rooms.length === 0 && (
              <div className="col-span-full py-12 text-center text-slate-400 text-sm">
                Belum ada kamar yang didaftarkan.
              </div>
            )}
          </div>
        </div>
      );
    }

    // 2. TAB PENYEWA
    function TenantsView({ tenants, rooms, onOpenCheckIn, refresh }) {
      const handleCheckout = async (tenant) => {
        if (!confirm(`Konfirmasi checkout untuk ${tenant.full_name}? Kamar akan berstatus kosong.`)) return;
        try {
          await db.from('tenants').update({ is_active: false }).eq('id', tenant.id);
          if (tenant.room_id) {
            await db.from('rooms').update({ status: 'empty' }).eq('id', tenant.room_id);
          }
          refresh();
        } catch (err) {
          alert('Gagal checkout: ' + err.message);
        }
      };

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center">
            <div>
              <h2 className="text-lg font-bold text-slate-100">Data Penghuni Aktif</h2>
              <p className="text-xs text-slate-400">Total {tenants.length} penghuni kost terdaftar</p>
            </div>
            <button
              onClick={onOpenCheckIn}
              className="bg-emerald-600/90 hover:bg-emerald-600 text-white text-xs font-semibold px-3.5 py-2 rounded-xl transition"
            >
              + Check-In Penyewa
            </button>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-950/60 border-b border-slate-800 text-slate-400 uppercase font-semibold text-[10px]">
                  <tr>
                    <th className="px-4 py-3">Kamar</th>
                    <th className="px-4 py-3">Nama Lengkap</th>
                    <th className="px-4 py-3">WhatsApp</th>
                    <th className="px-4 py-3">Tgl Masuk</th>
                    <th className="px-4 py-3">Jatuh Tempo</th>
                    <th className="px-4 py-3 text-right">Tindakan</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60">
                  {tenants.map((t) => {
                    const room = rooms.find(r => r.id === t.room_id);
                    return (
                      <tr key={t.id} className="hover:bg-slate-800/40 transition">
                        <td className="px-4 py-3 font-bold text-slate-100">Kamar {room?.room_number || '-'}</td>
                        <td className="px-4 py-3 font-medium text-slate-200">{t.full_name}</td>
                        <td className="px-4 py-3 text-slate-400">{t.phone}</td>
                        <td className="px-4 py-3 text-slate-400">{t.entry_date}</td>
                        <td className="px-4 py-3 text-slate-400">Tiap tgl {t.due_day}</td>
                        <td className="px-4 py-3 text-right">
                          <button
                            onClick={() => handleCheckout(t)}
                            className="text-[11px] font-semibold text-rose-400 bg-rose-950/40 border border-rose-800/40 px-2.5 py-1 rounded-lg hover:bg-rose-900/50 transition"
                          >
                            Checkout
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                  {tenants.length === 0 && (
                    <tr>
                      <td colSpan="6" className="text-center py-10 text-slate-400">Tidak ada penyewa aktif saat ini.</td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // 3. TAB TAGIHAN
    function BillingView({ bills, tenants, rooms, onOpenUtility, refresh }) {
      const markPaid = async (billId) => {
        try {
          await db.from('bills').update({
            payment_status: 'paid',
            paid_at: new Date().toISOString()
          }).eq('id', billId);
          refresh();
        } catch (err) {
          alert('Gagal update pembayaran: ' + err.message);
        }
      };

      return (
        <div className="space-y-4">
          <div>
            <h2 className="text-lg font-bold text-slate-100">Daftar Tagihan & Kas Masuk</h2>
            <p className="text-xs text-slate-400">Kelola invoice bulanan dan input meteran listrik</p>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-950/60 border-b border-slate-800 text-slate-400 uppercase font-semibold text-[10px]">
                  <tr>
                    <th className="px-4 py-3">Kamar</th>
                    <th className="px-4 py-3">Penyewa</th>
                    <th className="px-4 py-3">Sewa Pokok</th>
                    <th className="px-4 py-3">Listrik/Air</th>
                    <th className="px-4 py-3">Total</th>
                    <th className="px-4 py-3">Status</th>
                    <th className="px-4 py-3 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60">
                  {bills.map((b) => {
                    const room = rooms.find(r => r.id === b.room_id);
                    const tenant = tenants.find(t => t.id === b.tenant_id);
                    const isPaid = b.payment_status === 'paid';
                    const total = Number(b.rent_amount) + Number(b.utility_cost || 0);

                    return (
                      <tr key={b.id} className="hover:bg-slate-800/40 transition">
                        <td className="px-4 py-3 font-bold text-slate-100">{room?.room_number || '-'}</td>
                        <td className="px-4 py-3 text-slate-200">{tenant?.full_name || '-'}</td>
                        <td className="px-4 py-3 text-slate-400">Rp {Number(b.rent_amount).toLocaleString('id-ID')}</td>
                        <td className="px-4 py-3">
                          <span className="text-slate-300 font-medium">Rp {Number(b.utility_cost || 0).toLocaleString('id-ID')}</span>
                          {b.notes && <p className="text-[10px] text-slate-400 mt-0.5">{b.notes}</p>}
                        </td>
                        <td className="px-4 py-3 font-bold text-emerald-400">
                          Rp {total.toLocaleString('id-ID')}
                        </td>
                        <td className="px-4 py-3">
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${
                            isPaid 
                              ? 'bg-emerald-950/60 text-emerald-300 border-emerald-800/40' 
                              : 'bg-amber-950/60 text-amber-300 border-amber-800/40'
                          }`}>
                            {isPaid ? 'Lunas' : 'Belum Lunas'}
                          </span>
                        </td>
                        <td className="px-4 py-3 text-right space-x-1">
                          {!isPaid ? (
                            <>
                              <button
                                onClick={() => onOpenUtility(b)}
                                className="text-[11px] font-semibold text-sky-300 bg-sky-950/50 border border-sky-800/50 px-2.5 py-1 rounded-lg hover:bg-sky-900/60"
                              >
                                + Listrik
                              </button>
                              <button
                                onClick={() => markPaid(b.id)}
                                className="text-[11px] font-semibold text-emerald-300 bg-emerald-950/50 border border-emerald-800/50 px-2.5 py-1 rounded-lg hover:bg-emerald-900/60"
                              >
                                Tandai Lunas
                              </button>
                            </>
                          ) : (
                            <span className="text-[10px] text-slate-400">
                              {b.paid_at ? new Date(b.paid_at).toLocaleDateString('id-ID') : 'Selesai'}
                            </span>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                  {bills.length === 0 && (
                    <tr>
                      <td colSpan="7" className="text-center py-10 text-slate-400">Belum ada riwayat tagihan.</td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // 4. TAB PENGELUARAN KAS
    function ExpensesView({ expenses, refresh }) {
      const [category, setCategory] = useState('wifi');
      const [amount, setAmount] = useState('');
      const [description, setDescription] = useState('');
      const [saving, setSaving] = useState(false);

      const handleAddExpense = async (e) => {
        e.preventDefault();
        if (!amount) return;
        setSaving(true);
        try {
          await db.from('expenses').insert([{
            category,
            amount: parseFloat(amount),
            description,
            expense_date: new Date().toISOString().split('T')[0]
          }]);
          setAmount('');
          setDescription('');
          refresh();
        } catch (err) {
          alert('Gagal mencatat pengeluaran: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      const totalExpense = expenses.reduce((acc, curr) => acc + Number(curr.amount || 0), 0);

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          {/* Form Input */}
          <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl h-fit">
            <h3 className="text-sm font-bold text-slate-100 mb-3">Catat Kas Keluar</h3>
            <form onSubmit={handleAddExpense} className="space-y-3">
              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Kategori</label>
                <select
                  value={category}
                  onChange={(e) => setCategory(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                >
                  <option value="wifi">WiFi / Internet</option>
                  <option value="sampah">Iuran Sampah / Lingkungan</option>
                  <option value="listrik_umum">Token Listrik Umum</option>
                  <option value="perbaikan">Perbaikan & Tukang</option>
                  <option value="lainnya">Lain-lain</option>
                </select>
              </div>

              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Nominal (Rp)</label>
                <input
                  type="number"
                  required
                  placeholder="Contoh: 150000"
                  value={amount}
                  onChange={(e) => setAmount(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                />
              </div>

              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Keterangan</label>
                <textarea
                  rows="2"
                  placeholder="Keterangan singkat..."
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                />
              </div>

              <button
                type="submit"
                disabled={saving}
                className="w-full bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 font-bold py-2 rounded-xl text-xs transition"
              >
                {saving ? 'Menyimpan...' : 'Simpan Pengeluaran'}
              </button>
            </form>
          </div>

          {/* Riwayat Kas */}
          <div className="lg:col-span-2 bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <div className="flex justify-between items-center border-b border-slate-800 pb-3">
              <h3 className="text-sm font-bold text-slate-100">Riwayat Pengeluaran Operasional</h3>
              <span className="text-xs font-bold text-rose-400 bg-rose-950/40 border border-rose-800/40 px-3 py-1 rounded-full">
                Total: - Rp {totalExpense.toLocaleString('id-ID')}
              </span>
            </div>

            <div className="divide-y divide-slate-800/70 max-h-[420px] overflow-y-auto">
              {expenses.map((item) => (
                <div key={item.id} className="py-2.5 flex justify-between items-start">
                  <div>
                    <p className="text-xs font-bold text-slate-200 capitalize">{item.category.replace('_', ' ')}</p>
                    <p className="text-[11px] text-slate-400">{item.description || '-'}</p>
                    <span className="text-[10px] text-slate-400">{item.expense_date}</span>
                  </div>
                  <span className="text-xs font-bold text-rose-400">
                    - Rp {Number(item.amount).toLocaleString('id-ID')}
                  </span>
                </div>
              ))}
              {expenses.length === 0 && (
                <p className="text-center py-8 text-xs text-slate-400">Belum ada catatan pengeluaran.</p>
              )}
            </div>
          </div>
        </div>
      );
    }

    // MODAL TAMBAH UNIT
    function AddRoomModal({ onClose, refresh }) {
      const [roomNumber, setRoomNumber] = useState('');
      const [price, setPrice] = useState('1000000');
      const [saving, setSaving] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          await db.from('rooms').insert([{
            room_number: roomNumber,
            monthly_price: parseFloat(price),
            status: 'empty'
          }]);
          refresh();
          onClose();
        } catch (err) {
          alert('Gagal: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-xs p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl">
            <h3 className="text-sm font-bold text-slate-100 mb-3">Tambah Unit Kamar Baru</h3>
            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Nomor / Kode Kamar</label>
                <input
                  type="text"
                  required
                  placeholder="Contoh: 101, B2"
                  value={roomNumber}
                  onChange={(e) => setRoomNumber(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                />
              </div>
              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Harga Sewa / Bulan (Rp)</label>
                <input
                  type="number"
                  required
                  value={price}
                  onChange={(e) => setPrice(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                />
              </div>
              <div className="flex justify-end gap-2 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-3 py-1.5 text-xs text-slate-400 hover:text-slate-200"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className="px-3.5 py-1.5 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl"
                >
                  {saving ? 'Menyimpan...' : 'Simpan'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // MODAL CHECK-IN
    function AddTenantModal({ rooms, onClose, refresh }) {
      const [roomId, setRoomId] = useState(rooms[0]?.id || '');
      const [fullName, setFullName] = useState('');
      const [phone, setPhone] = useState('');
      const [entryDate, setEntryDate] = useState(new Date().toISOString().split('T')[0]);
      const [dueDay, setDueDay] = useState(new Date().getDate());
      const [saving, setSaving] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!roomId) return alert('Pilih kamar terlebih dahulu');
        setSaving(true);
        try {
          const selectedRoom = rooms.find(r => r.id === roomId);

          const { data: tenant, error: tErr } = await db.from('tenants').insert([{
            room_id: roomId,
            full_name: fullName,
            phone,
            entry_date: entryDate,
            due_day: parseInt(dueDay)
          }]).select().single();
          if (tErr) throw tErr;

          await db.from('rooms').update({ status: 'occupied' }).eq('id', roomId);

          const billingMonth = new Date(entryDate);
          billingMonth.setDate(1);

          await db.from('bills').insert([{
            tenant_id: tenant.id,
            room_id: roomId,
            billing_month: billingMonth.toISOString().split('T')[0],
            rent_amount: selectedRoom.monthly_price,
            utility_cost: 0,
            payment_status: 'unpaid',
            notes: 'Tagihan bulan pertama'
          }]);

          refresh();
          onClose();
        } catch (err) {
          alert('Gagal check-in: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-xs p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl">
            <h3 className="text-sm font-bold text-slate-100 mb-3">Check-In Penyewa Baru</h3>
            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Pilih Kamar Kosong</label>
                <select
                  value={roomId}
                  onChange={(e) => setRoomId(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                  required
                >
                  <option value="">-- Pilih Kamar --</option>
                  {rooms.map((r) => (
                    <option key={r.id} value={r.id}>
                      Kamar {r.room_number} - Rp {Number(r.monthly_price).toLocaleString('id-ID')}
                    </option>
                  ))}
                </select>
              </div>

              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Nama Penyewa</label>
                <input
                  type="text"
                  required
                  placeholder="Nama lengkap"
                  value={fullName}
                  onChange={(e) => setFullName(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                />
              </div>

              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">No. WhatsApp</label>
                <input
                  type="tel"
                  required
                  placeholder="081234567890"
                  value={phone}
                  onChange={(e) => setPhone(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-[11px] font-bold text-slate-400 block mb-1">Tgl Masuk</label>
                  <input
                    type="date"
                    required
                    value={entryDate}
                    onChange={(e) => setEntryDate(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                  />
                </div>
                <div>
                  <label className="text-[11px] font-bold text-slate-400 block mb-1">Jatuh Tempo (Tgl)</label>
                  <input
                    type="number"
                    min="1"
                    max="31"
                    required
                    value={dueDay}
                    onChange={(e) => setDueDay(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                  />
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-3 py-1.5 text-xs text-slate-400 hover:text-slate-200"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className="px-3.5 py-1.5 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl"
                >
                  {saving ? 'Menyimpan...' : 'Check-In'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // MODAL METERAN LISTRIK
    function UtilityModal({ bill, onClose, refresh }) {
      const [prevMeter, setPrevMeter] = useState(0);
      const [currMeter, setCurrMeter] = useState(0);
      const [rate, setRate] = useState(2500);
      const [saving, setSaving] = useState(false);

      const usage = Math.max(0, currMeter - prevMeter);
      const cost = usage * rate;

      const handleSave = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          await db.from('bills').update({
            utility_cost: cost,
            notes: `Listrik: (${currMeter} - ${prevMeter}) = ${usage} kWh @ Rp ${Number(rate).toLocaleString('id-ID')}`
          }).eq('id', bill.id);
          refresh();
          onClose();
        } catch (err) {
          alert('Gagal: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-xs p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-xs w-full p-5 shadow-2xl">
            <h3 className="text-sm font-bold text-slate-100 mb-1">Kalkulator Listrik</h3>
            <p className="text-[11px] text-slate-400 mb-3">Input angka meteran kamar</p>

            <form onSubmit={handleSave} className="space-y-3">
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-[10px] font-bold text-slate-400 block mb-1">Meter Awal</label>
                  <input
                    type="number"
                    value={prevMeter}
                    onChange={(e) => setPrevMeter(Number(e.target.value))}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-emerald-500"
                  />
                </div>
                <div>
                  <label className="text-[10px] font-bold text-slate-400 block mb-1">Meter Akhir</label>
                  <input
                    type="number"
                    value={currMeter}
                    onChange={(e) => setCurrMeter(Number(e.target.value))}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-emerald-500"
                  />
                </div>
              </div>

              <div>
                <label className="text-[10px] font-bold text-slate-400 block mb-1">Tarif / kWh (Rp)</label>
                <input
                  type="number"
                  value={rate}
                  onChange={(e) => setRate(Number(e.target.value))}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-emerald-500"
                />
              </div>

              <div className="bg-slate-950/80 border border-slate-800 p-2.5 rounded-xl text-[11px] space-y-1">
                <div className="flex justify-between text-slate-400">
                  <span>Pemakaian:</span>
                  <span className="font-bold text-slate-200">{usage} kWh</span>
                </div>
                <div className="flex justify-between font-bold text-emerald-400 border-t border-slate-800 pt-1">
                  <span>Biaya Tambahan:</span>
                  <span>Rp {cost.toLocaleString('id-ID')}</span>
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-3 py-1.5 text-xs text-slate-400 hover:text-slate-200"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className="px-3.5 py-1.5 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl"
                >
                  {saving ? 'Menghitung...' : 'Tambahkan'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

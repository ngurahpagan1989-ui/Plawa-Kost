<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plawa Kost Management</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-200 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Supabase Client
    const SUPABASE_URL = 'https://oqqrarwwbhxdpocaerog.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xcXJhcnd3Ymh4ZHBvY2Flcm9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMDI1NDksImV4cCI6MjEwNjY3ODU0OX0.XHVPjy01DZHo5uKhGZyClA-Jr6nKeqQi4FajatbSZKI';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Kredensial Pembayaran Pemilik Kost
    const KOST_PAYMENT_INFO = {
      bankName: 'BCA',
      accountNumber: '1234-5678-90',
      accountHolder: 'Pengelola Plawa Kost',
      ownerWa: '6281234567890'
    };

    function App() {
      // Mode Tampilan: 'admin' | 'tenant_login' | 'tenant_portal'
      const [viewMode, setViewMode] = useState('admin');
      const [currentTenant, setCurrentTenant] = useState(null);

      // Data Utama
      const [activeTab, setActiveTab] = useState('rooms');
      const [rooms, setRooms] = useState([]);
      const [tenants, setTenants] = useState([]);
      const [bills, setBills] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [complaints, setComplaints] = useState([]);
      const [loading, setLoading] = useState(true);

      // Modals State Admin
      const [isAddTenantOpen, setIsAddTenantOpen] = useState(false);
      const [isAddRoomOpen, setIsAddRoomOpen] = useState(false);
      const [isAddComplaintOpen, setIsAddComplaintOpen] = useState(false);
      const [selectedBillForUtility, setSelectedBillForUtility] = useState(null);

      // Cek apakah ada query '?portal=penghuni' di URL
      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('portal') === 'penghuni') {
          setViewMode('tenant_login');
        }
      }, []);

      const loadAllData = async () => {
        setLoading(true);
        try {
          const [roomsRes, tenantsRes, billsRes, expensesRes, complaintsRes] = await Promise.all([
            db.from('rooms').select('*').order('room_number'),
            db.from('tenants').select('*').eq('is_active', true).order('created_at', { ascending: false }),
            db.from('bills').select('*').order('created_at', { ascending: false }),
            db.from('expenses').select('*').order('expense_date', { ascending: false }),
            db.from('complaints').select('*').order('created_at', { ascending: false })
          ]);

          if (roomsRes.data) setRooms(roomsRes.data);
          if (tenantsRes.data) setTenants(tenantsRes.data);
          if (billsRes.data) setBills(billsRes.data);
          if (expensesRes.data) setExpenses(expensesRes.data);
          if (complaintsRes.data) setComplaints(complaintsRes.data);
        } catch (err) {
          console.error("Gagal membaca database:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadAllData();
      }, []);

      // JIKA DI MODE PORTAL PENGHUNI (LOGIN)
      if (viewMode === 'tenant_login') {
        return (
          <TenantLoginView 
            rooms={rooms} 
            tenants={tenants} 
            onSuccess={(tenant) => {
              setCurrentTenant(tenant);
              setViewMode('tenant_portal');
            }} 
            onBackToAdmin={() => setViewMode('admin')} 
          />
        );
      }

      // JIKA DI MODE PORTAL PENGHUNI (DASHBOARD)
      if (viewMode === 'tenant_portal' && currentTenant) {
        return (
          <TenantPortalView 
            tenant={currentTenant} 
            room={rooms.find(r => r.id === currentTenant.room_id)} 
            bills={bills.filter(b => b.tenant_id === currentTenant.id)} 
            complaints={complaints.filter(c => c.tenant_id === currentTenant.id || c.room_id === currentTenant.room_id)} 
            onLogout={() => {
              setCurrentTenant(null);
              setViewMode('tenant_login');
            }} 
            refresh={loadAllData} 
          />
        );
      }

      // VIEW MODE ADMIN (PANEL PENGELOLA)
      const pendingComplaintsCount = complaints.filter(c => c.status !== 'resolved').length;

      const navItems = [
        { id: 'rooms', label: 'Denah Kamar', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
        { id: 'tenants', label: 'Penghuni', icon: 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z' },
        { id: 'billing', label: 'Invoice Penghuni', icon: 'M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2z' },
        { id: 'complaints', label: 'Tiket Komplain', badge: pendingComplaintsCount, icon: 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z' },
        { id: 'expenses', label: 'Kas Pengeluaran', icon: 'M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z' }
      ];

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-slate-950 text-slate-300">
          {/* SIDEBAR ADMIN */}
          <aside className="w-full md:w-64 bg-slate-900/90 border-b md:border-b-0 md:border-r border-slate-800/80 p-5 flex flex-col shrink-0">
            <div className="flex items-center gap-3 mb-8">
              <div className="w-10 h-10 rounded-xl bg-emerald-600/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-black text-lg">
                P
              </div>
              <div>
                <h1 className="text-base font-bold text-slate-100 tracking-wide">Plawa Kost</h1>
                <p className="text-xs text-slate-400">Panel Pengelola</p>
              </div>
            </div>

            <nav className="flex md:flex-col gap-1.5 overflow-x-auto md:overflow-visible pb-2 md:pb-0">
              {navItems.map((item) => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                    activeTab === item.id
                      ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <div className="flex items-center gap-3">
                    <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={item.icon}></path>
                    </svg>
                    <span>{item.label}</span>
                  </div>
                  {item.badge > 0 && (
                    <span className="bg-amber-500/20 text-amber-400 border border-amber-500/40 text-[10px] px-1.5 py-0.2 rounded-full font-bold ml-2">
                      {item.badge}
                    </span>
                  )}
                </button>
              ))}
            </nav>

            {/* Tombol Alih ke Portal Penghuni */}
            <div className="mt-auto pt-6 border-t border-slate-800/60 space-y-3">
              <button
                onClick={() => setViewMode('tenant_login')}
                className="w-full bg-slate-800 hover:bg-slate-700 text-sky-300 border border-sky-800/40 text-xs font-semibold px-3 py-2 rounded-xl flex items-center justify-center gap-2 transition"
              >
                <span>🌐 Buka Portal Penghuni</span>
              </button>
              <div className="text-[11px] text-slate-500 text-center">
                Database: <span className="text-emerald-400 font-medium">Terhubung</span>
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT ADMIN */}
          <main className="flex-1 p-5 md:p-8 overflow-y-auto">
            {loading ? (
              <div className="flex items-center justify-center py-32 text-slate-400 text-sm">
                Memuat data properti...
              </div>
            ) : (
              <div className="max-w-5xl mx-auto space-y-6">
                {activeTab === 'rooms' && (
                  <RoomsView 
                    rooms={rooms} 
                    tenants={tenants} 
                    onOpenAddRoom={() => setIsAddRoomOpen(true)}
                  />
                )}
                {activeTab === 'tenants' && (
                  <TenantsView 
                    tenants={tenants} 
                    rooms={rooms} 
                    onOpenCheckIn={() => setIsAddTenantOpen(true)} 
                    refresh={loadAllData}
                  />
                )}
                {activeTab === 'billing' && (
                  <BillingView 
                    bills={bills} 
                    tenants={tenants} 
                    rooms={rooms} 
                    onOpenUtility={(bill) => setSelectedBillForUtility(bill)} 
                    refresh={loadAllData}
                  />
                )}
                {activeTab === 'complaints' && (
                  <ComplaintsView 
                    complaints={complaints} 
                    rooms={rooms} 
                    tenants={tenants} 
                    onOpenAdd={() => setIsAddComplaintOpen(true)} 
                    refresh={loadAllData}
                  />
                )}
                {activeTab === 'expenses' && (
                  <ExpensesView 
                    expenses={expenses} 
                    refresh={loadAllData}
                  />
                )}
              </div>
            )}
          </main>

          {/* MODALS ADMIN */}
          {isAddRoomOpen && (
            <AddRoomModal 
              onClose={() => setIsAddRoomOpen(false)} 
              refresh={loadAllData} 
            />
          )}
          {isAddTenantOpen && (
            <AddTenantModal 
              rooms={rooms} 
              onClose={() => setIsAddTenantOpen(false)} 
              refresh={loadAllData} 
            />
          )}
          {isAddComplaintOpen && (
            <AddComplaintModal 
              rooms={rooms} 
              tenants={tenants} 
              onClose={() => setIsAddComplaintOpen(false)} 
              refresh={loadAllData} 
            />
          )}
          {selectedBillForUtility && (
            <UtilityModal 
              bill={selectedBillForUtility} 
              tenant={tenants.find(t => t.id === selectedBillForUtility.tenant_id)}
              room={rooms.find(r => r.id === selectedBillForUtility.room_id)}
              allTenantsInRoom={tenants.filter(t => t.room_id === selectedBillForUtility.room_id)}
              onClose={() => setSelectedBillForUtility(null)} 
              refresh={loadAllData} 
            />
          )}
        </div>
      );
    }

    // ==========================================
    // 🏢 VIEW KHUSUS: PORTAL PENGHUNI (TENANT)
    // ==========================================

    function TenantLoginView({ rooms, tenants, onSuccess, onBackToAdmin }) {
      const [roomId, setRoomId] = useState(rooms[0]?.id || '');
      const [phoneInput, setPhoneInput] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        setErrorMsg('');

        const cleanInput = phoneInput.replace(/[^0-9]/g, '');
        if (!cleanInput) {
          setErrorMsg('Masukkan nomor WhatsApp yang terdaftar.');
          return;
        }

        // Cari tenant yang cocok dengan kamar & no telp
        const matched = tenants.find(t => {
          const tPhone = (t.phone || '').replace(/[^0-9]/g, '');
          return t.room_id === roomId && (tPhone.includes(cleanInput) || cleanInput.includes(tPhone));
        });

        if (matched) {
          onSuccess(matched);
        } else {
          setErrorMsg('Data tidak cocok. Pastikan memilih kamar yang tepat & nomor WhatsApp sesuai.');
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-6">
            <div className="text-center space-y-2">
              <div className="w-12 h-12 bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 font-black rounded-2xl flex items-center justify-center mx-auto text-xl">
                P
              </div>
              <h2 className="text-lg font-bold text-slate-100">Portal Penghuni Plawa Kost</h2>
              <p className="text-xs text-slate-400">Masuk untuk melihat rincian tagihan & lapor fasilitas</p>
            </div>

            {errorMsg && (
              <div className="bg-rose-950/40 border border-rose-800/40 text-rose-300 text-xs p-3 rounded-xl text-center">
                {errorMsg}
              </div>
            )}

            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Pilih Kamar Anda</label>
                <select
                  value={roomId}
                  onChange={(e) => setRoomId(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                  required
                >
                  {rooms.map(r => (
                    <option key={r.id} value={r.id}>Kamar {r.room_number}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Nomor WhatsApp Terdaftar</label>
                <input
                  type="tel"
                  required
                  placeholder="Contoh: 081234567890"
                  value={phoneInput}
                  onChange={(e) => setPhoneInput(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                />
              </div>

              <button
                type="submit"
                className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-emerald-950"
              >
                Masuk ke Portal
              </button>
            </form>

            <div className="pt-2 text-center">
              <button
                onClick={onBackToAdmin}
                className="text-[11px] text-slate-500 hover:text-slate-300"
              >
                ← Kembali ke Panel Pengelola
              </button>
            </div>
          </div>
        </div>
      );
    }

    function TenantPortalView({ tenant, room, bills, complaints, onLogout, refresh }) {
      const [portalTab, setPortalTab] = useState('bills'); // 'bills' | 'complaint' | 'info'
      const [newTitle, setNewTitle] = useState('');
      const [newDesc, setNewDesc] = useState('');
      const [savingComplaint, setSavingComplaint] = useState(false);

      // Ambil tagihan terbaru
      const latestBill = bills[0];
      const isPaid = latestBill?.payment_status === 'paid';

      const rent = Number(latestBill?.rent_amount || 0);
      const electric = Number(latestBill?.electric_cost || 0);
      const water = Number(latestBill?.water_cost || 0);
      const waste = Number(latestBill?.waste_cost || 0);
      const extra = Number(latestBill?.extra_guest_cost || 0);
      const totalAmount = rent + electric + water + waste + extra;

      const handleSendComplaint = async (e) => {
        e.preventDefault();
        setSavingComplaint(true);
        try {
          await db.from('complaints').insert([{
            room_id: room.id,
            tenant_id: tenant.id,
            title: newTitle,
            description: newDesc,
            category: 'fasilitas',
            status: 'pending'
          }]);
          setNewTitle('');
          setNewDesc('');
          alert('Tiket keluhan berhasil dikirim ke pengelola!');
          refresh();
        } catch (err) {
          alert('Gagal mengirim keluhan: ' + err.message);
        } finally {
          setSavingComplaint(false);
        }
      };

      const handleConfirmPaymentViaWA = () => {
        const text = `Halo Pengelola Plawa Kost, saya *${tenant.full_name}* (Kamar *${room?.room_number}*) ingin mengonfirmasi pembayaran tagihan sebesar *Rp ${totalAmount.toLocaleString('id-ID')}*. Berikut bukti transfer saya:`;
        window.open(`https://wa.me/${KOST_PAYMENT_INFO.ownerWa}?text=${encodeURIComponent(text)}`, '_blank');
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-200 p-4 sm:p-6 max-w-xl mx-auto space-y-5">
          {/* Header Penghuni */}
          <header className="bg-slate-900 border border-slate-800 p-4 rounded-3xl flex justify-between items-center shadow-sm">
            <div>
              <span className="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">Penghuni Aktif</span>
              <h2 className="text-base font-bold text-slate-100">{tenant.full_name}</h2>
              <p className="text-xs text-slate-400">Kamar {room?.room_number} • Jatuh Tempo Tgl {tenant.due_day}</p>
            </div>
            <button
              onClick={onLogout}
              className="text-xs text-slate-400 hover:text-rose-400 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800 transition"
            >
              Keluar
            </button>
          </header>

          {/* Navigasi Tab Portal */}
          <div className="grid grid-cols-3 gap-1 bg-slate-900 p-1.5 rounded-2xl border border-slate-800 text-xs font-semibold">
            {[
              { id: 'bills', label: 'Tagihan' },
              { id: 'complaint', label: 'Komplain' },
              { id: 'info', label: 'Info Kost' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setPortalTab(tab.id)}
                className={`py-2 rounded-xl transition ${
                  portalTab === tab.id
                    ? 'bg-slate-800 text-emerald-400 font-bold shadow-sm'
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* TAB 1: TAGIHAN */}
          {portalTab === 'bills' && (
            <div className="space-y-4">
              {latestBill ? (
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-sm">
                  <div className="flex justify-between items-start border-b border-slate-800 pb-3">
                    <div>
                      <span className="text-xs text-slate-400 font-medium">Tagihan Bulan Berjalan</span>
                      <p className="text-sm font-bold text-slate-200 mt-0.5">Periode {latestBill.billing_month}</p>
                    </div>
                    <span className={`text-[11px] font-bold px-2.5 py-1 rounded-full border ${
                      isPaid 
                        ? 'bg-emerald-950/60 text-emerald-300 border-emerald-800/50' 
                        : 'bg-amber-950/60 text-amber-300 border-amber-800/50'
                    }`}>
                      {isPaid ? '✓ Sudah Lunas' : 'Belum Lunas'}
                    </span>
                  </div>

                  {/* Rincian Komponen Biaya */}
                  <div className="space-y-2 text-xs">
                    <div className="flex justify-between text-slate-300">
                      <span>• Sewa Kamar:</span>
                      <span>Rp {rent.toLocaleString('id-ID')}</span>
                    </div>
                    <div className="flex justify-between text-slate-300">
                      <span>• Listrik (Porsi Kamar):</span>
                      <span className="text-sky-400">Rp {electric.toLocaleString('id-ID')}</span>
                    </div>
                    <div className="flex justify-between text-slate-300">
                      <span>• Air (Per Kepala):</span>
                      <span className="text-teal-400">Rp {water.toLocaleString('id-ID')}</span>
                    </div>
                    <div className="flex justify-between text-slate-300">
                      <span>• Iuran Sampah:</span>
                      <span>Rp {waste.toLocaleString('id-ID')}</span>
                    </div>
                    {extra > 0 && (
                      <div className="flex justify-between text-amber-300">
                        <span>• Tambahan Tamu Menginap:</span>
                        <span>Rp {extra.toLocaleString('id-ID')}</span>
                      </div>
                    )}
                  </div>

                  {/* Total Tagihan */}
                  <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                    <span className="text-xs font-bold text-slate-300">Total Pembayaran:</span>
                    <span className="text-base font-black text-emerald-400">
                      Rp {totalAmount.toLocaleString('id-ID')}
                    </span>
                  </div>

                  {/* Info Pembayaran Transfer */}
                  {!isPaid && (
                    <div className="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl space-y-3">
                      <p className="text-[11px] text-slate-400 font-medium">Rekening Pembayaran Kost:</p>
                      <div className="flex justify-between items-center bg-slate-900 px-3 py-2 rounded-xl">
                        <div>
                          <p className="text-xs font-bold text-slate-200">{KOST_PAYMENT_INFO.bankName}: {KOST_PAYMENT_INFO.accountNumber}</p>
                          <p className="text-[10px] text-slate-400">a/n {KOST_PAYMENT_INFO.accountHolder}</p>
                        </div>
                      </div>

                      <button
                        onClick={handleConfirmPaymentViaWA}
                        className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 transition"
                      >
                        <span>Konfirmasi Pembayaran via WA</span>
                      </button>
                    </div>
                  )}
                </div>
              ) : (
                <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center text-slate-400 text-xs">
                  Belum ada tagihan aktif untuk akun Anda.
                </div>
              )}
            </div>
          )}

          {/* TAB 2: TIKET KOMPLAIN FASILITAS */}
          {portalTab === 'complaint' && (
            <div className="space-y-4">
              {/* Form Lapor */}
              <div className="bg-slate-900 border border-slate-800 p-5 rounded-3xl space-y-3">
                <h3 className="text-xs font-bold text-slate-100">Lapor Kerusakan / Keluhan</h3>
                <form onSubmit={handleSendComplaint} className="space-y-3">
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 block mb-1">Judul Keluhan</label>
                    <input
                      type="text"
                      required
                      placeholder="Contoh: Lampu kamar mandi mati / Kran bocor"
                      value={newTitle}
                      onChange={(e) => setNewTitle(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                    />
                  </div>
                  <div>

    function BillingView({ bills, tenants, rooms, onOpenUtility, refresh }) {
      const [generating, setGenerating] = useState(false);

      const markPaid = async (billId) => {
        try {
          await db.from('bills').update({
            payment_status: 'paid',
            paid_at: new Date().toISOString()
          }).eq('id', billId);
          refresh();
        } catch (err) {
          alert('Gagal update status: ' + err.message);
        }
      };

      const handleGenerateMonthlyBills = async () => {
        const today = new Date();
        const nextMonth = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
        
        if (!confirm(`Terbitkan invoice baru untuk semua orang untuk periode ${nextMonth}?`)) return;

        setGenerating(true);
        try {
          let createdCount = 0;
          for (const tenant of tenants) {
            const existing = bills.find(b => b.tenant_id === tenant.id && b.billing_month === nextMonth);
            if (!existing) {
              const room = rooms.find(r => r.id === tenant.room_id);
              const roomTenants = tenants.filter(t => t.room_id === tenant.room_id);
              const tenantCount = Math.max(1, roomTenants.length);

              const splitRent = room ? Math.round(Number(room.monthly_price) / tenantCount) : 0;
              const splitWaste = Math.round(25000 / tenantCount);
              const waterPerPerson = 30000;

              await db.from('bills').insert([{
                tenant_id: tenant.id,
                room_id: tenant.room_id,
                billing_month: nextMonth,
                rent_amount: splitRent,
                electric_cost: 0,
                water_cost: waterPerPerson,
                waste_cost: splitWaste,
                extra_guest_cost: 0,
                utility_cost: waterPerPerson + splitWaste,
                payment_status: 'unpaid',
                notes: `Air Rp30rb, Sampah Rp${splitWaste.toLocaleString('id-ID')}`
              }]);
              createdCount++;
            }
          }
          alert(`Berhasil menerbitkan ${createdCount} invoice baru.`);
          refresh();
        } catch (err) {
          alert('Gagal menerbitkan invoice: ' + err.message);
        } finally {
          setGenerating(false);
        }
      };

      const sendWhatsAppInvoice = (bill, tenant, room) => {
        const rent = Number(bill.rent_amount || 0);
        const electric = Number(bill.electric_cost || 0);
        const water = Number(bill.water_cost || 0);
        const waste = Number(bill.waste_cost || 0);
        const extra = Number(bill.extra_guest_cost || 0);
        const total = rent + electric + water + waste + extra;

        let phone = tenant?.phone ? tenant.phone.replace(/[^0-9]/g, '') : '';
        if (phone.startsWith('0')) phone = '62' + phone.slice(1);

        let msg = `Halo Kak *${tenant?.full_name}*,\n`;
        msg += `Berikut rincian tagihan sewa Kamar *${room?.room_number}*:\n\n`;
        msg += `• Sewa Pokok: Rp ${rent.toLocaleString('id-ID')}\n`;
        msg += `• Listrik (Porsi Kamar): Rp ${electric.toLocaleString('id-ID')}\n`;
        msg += `• Air (Per Orang): Rp ${water.toLocaleString('id-ID')}\n`;
        msg += `• Uang Sampah: Rp ${waste.toLocaleString('id-ID')}\n`;
        if (extra > 0) {
          msg += `• Tambahan Tamu/Non-Penyewa: Rp ${extra.toLocaleString('id-ID')}\n`;
        }
        msg += `------------------------------------\n`;
        msg += `*TOTAL TAGIHAN: Rp ${total.toLocaleString('id-ID')}*\n\n`;
        msg += `Bisa dicek juga langsung lewat Portal Penghuni:\nhttps://ngurahpagan1989-ui.github.io/Plawa-Kost/?portal=penghuni\n\n`;
        msg += `Pembayaran via ${KOST_PAYMENT_INFO.bankName}: ${KOST_PAYMENT_INFO.accountNumber} a/n ${KOST_PAYMENT_INFO.accountHolder}.\nTerima kasih! 🙏`;

        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
      };

      return (
        <div className="space-y-4">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
              <h2 className="text-lg font-bold text-slate-100">Invoice Tagihan Per Orang</h2>
              <p className="text-xs text-slate-400">Rincian sewa, listrik, air, sampah, & tambahan tamu</p>
            </div>
            <button
              onClick={handleGenerateMonthlyBills}
              disabled={generating}
              className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold px-3.5 py-2 rounded-xl transition shadow-sm"
            >
              {generating ? 'Menerbitkan...' : '+ Terbitkan Invoice Bulan Baru'}
            </button>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-950/60 border-b border-slate-800 text-slate-400 uppercase font-semibold text-[10px]">
                  <tr>
                    <th className="px-4 py-3">Penghuni & Kamar</th>
                    <th className="px-4 py-3">Sewa</th>
                    <th className="px-4 py-3">Listrik</th>
                    <th className="px-4 py-3">Air</th>
                    <th className="px-4 py-3">Sampah</th>
                    <th className="px-4 py-3">Tamu</th>
                    <th className="px-4 py-3">Total</th>
                    <th className="px-4 py-3">Status</th>
                    <th className="px-4 py-3 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60">
                  {bills.map((b) => {
                    const room = rooms.find(r => r.id === b.room_id);
                    const tenant = tenants.find(t => t.id === b.tenant_id);
                    const isPaid = b.payment_status === 'paid';

                    const rent = Number(b.rent_amount || 0);
                    const electric = Number(b.electric_cost || 0);
                    const water = Number(b.water_cost || 0);
                    const waste = Number(b.waste_cost || 0);
                    const extra = Number(b.extra_guest_cost || 0);
                    const total = rent + electric + water + waste + extra;

                    return (
                      <tr key={b.id} className="hover:bg-slate-800/40 transition">
                        <td className="px-4 py-3">
                          <p className="font-bold text-slate-100">{tenant?.full_name || '-'}</p>
                          <span className="text-[10px] text-slate-400">Kamar {room?.room_number || '-'}</span>
                        </td>
                        <td className="px-4 py-3 text-slate-400">Rp {rent.toLocaleString('id-ID')}</td>
                        <td className="px-4 py-3 text-sky-400">Rp {electric.toLocaleString('id-ID')}</td>
                        <td className="px-4 py-3 text-teal-400">Rp {water.toLocaleString('id-ID')}</td>
                        <td className="px-4 py-3 text-slate-400">Rp {waste.toLocaleString('id-ID')}</td>
                        <td className="px-4 py-3 text-amber-400">Rp {extra.toLocaleString('id-ID')}</td>
                        <td className="px-4 py-3 font-bold text-emerald-400">Rp {total.toLocaleString('id-ID')}</td>
                        <td className="px-4 py-3">
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${
                            isPaid 
                              ? 'bg-emerald-950/60 text-emerald-300 border-emerald-800/40' 
                              : 'bg-amber-950/60 text-amber-300 border-amber-800/40'
                          }`}>
                            {isPaid ? 'Lunas' : 'Belum Lunas'}
                          </span>
                        </td>
                        <td className="px-4 py-3 text-right space-x-1 whitespace-nowrap">
                          <button
                            onClick={() => sendWhatsAppInvoice(b, tenant, room)}
                            title="Kirim ke WhatsApp"
                            className="text-[11px] font-semibold text-emerald-400 bg-emerald-950/40 border border-emerald-800/50 px-2 py-1 rounded-lg hover:bg-emerald-900/60 transition"
                          >
                            WA
                          </button>

                          {!isPaid ? (
                            <>
                              <button
                                onClick={() => onOpenUtility(b)}
                                className="text-[11px] font-semibold text-sky-300 bg-sky-950/50 border border-sky-800/50 px-2 py-1 rounded-lg hover:bg-sky-900/60 transition"
                              >
                                Edit Rincian

                              >
                                Lunas

                            </>

                            <span className="text-[10px] text-slate-400 pl-1">

                    );

                  {bills.length === 0 && (

                      <td colSpan="9" className="text-center py-10 text-slate-400">Belum ada invoice diterbitkan.</td>
                    </tr>
                  )}

              </table>
            </div>
          </div>
        </div>
      );

        e.preventDefault();
        if (!amount) return;
        setSaving(true);
        try {
          await db.from('expenses').insert([{
            category,
            amount: parseFloat(amount),
            description,
            expense_date: new Date().toISOString().split('T')[0]
          }]);
          setAmount('');
          setDescription('');
          refresh();
        } catch (err) {
          alert('Gagal mencatat kas: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      const handleDeleteExpense = async (id) => {
        if (!confirm('Hapus pengeluaran ini?')) return;
        try {
          await db.from('expenses').delete().eq('id', id);
          refresh();
        } catch (err) {
          alert('Gagal: ' + err.message);
        }
      };

      const totalExpense = expenses.reduce((acc, curr) => acc + Number(curr.amount || 0), 0);

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl h-fit">
            <h3 className="text-sm font-bold text-slate-100 mb-3">Catat Pengeluaran</h3>
            <form onSubmit={handleAddExpense} className="space-y-3">
              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Kategori</label>
                <select
                  value={category}
                  onChange={(e) => setCategory(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                >
                  <option value="wifi">WiFi / Internet</option>
                  <option value="sampah">Iuran Sampah / Banjar</option>
                  <option value="listrik_umum">Token Listrik Umum</option>
                  <option value="perbaikan">Perbaikan & Tukang</option>
                  <option value="lainnya">Lain-lain</option>
                </select>
              </div>

              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Nominal (Rp)</label>
                <input
                  type="number"
                  required
                  placeholder="150000"
                  value={amount}
                  onChange={(e) => setAmount(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                />
              </div>

              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Keterangan</label>
                <textarea
                  rows="2"
                  placeholder="Keterangan singkat..."
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                />
              </div>

              <button
                type="submit"
                disabled={saving}
                className="w-full bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 font-bold py-2 rounded-xl text-xs transition"
              >
                {saving ? 'Menyimpan...' : 'Simpan Pengeluaran'}
              </button>
            </form>
          </div>

          <div className="lg:col-span-2 bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <div className="flex justify-between items-center border-b border-slate-800 pb-3">
              <h3 className="text-sm font-bold text-slate-100">Riwayat Pengeluaran Operasional</h3>
              <span className="text-xs font-bold text-rose-400 bg-rose-950/40 border border-rose-800/40 px-3 py-1 rounded-full">
                Total: - Rp {totalExpense.toLocaleString('id-ID')}
              </span>
            </div>

            <div className="divide-y divide-slate-800/70 max-h-[420px] overflow-y-auto">
              {expenses.map((item) => (
                <div key={item.id} className="py-2.5 flex justify-between items-start">
                  <div>
                    <p className="text-xs font-bold text-slate-200 capitalize">{item.category.replace('_', ' ')}</p>
                    <p className="text-[11px] text-slate-400">{item.description || '-'}</p>
                    <span className="text-[10px] text-slate-400">{item.expense_date}</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="text-xs font-bold text-rose-400">
                      - Rp {Number(item.amount).toLocaleString('id-ID')}
                    </span>
                    <button
                      onClick={() => handleDeleteExpense(item.id)}
                      className="text-slate-400 hover:text-rose-400 text-xs transition"
                    >
                      ✕
                    </button>
                  </div>
                </div>
              ))}
              {expenses.length === 0 && (
                <p className="text-center py-8 text-xs text-slate-400">Belum ada pengeluaran kas.</p>
              )}
            </div>
          </div>
        </div>
      );
    }

    // MODAL EDIT RINCIAN LENGKAP UTILITAS (AMAN BACKSPACE / BEBAS ANGKA 0)
    function UtilityModal({ bill, tenant, room, allTenantsInRoom, onClose, refresh }) {
      const tenantCountInRoom = Math.max(1, allTenantsInRoom.length);

      const [rentPortion, setRentPortion] = useState(
        bill.rent_amount !== undefined && bill.rent_amount !== null 
          ? bill.rent_amount 
          : (room ? Math.round(room.monthly_price / tenantCountInRoom) : '')
      );

      const [roomElectricTotal, setRoomElectricTotal] = useState(
        bill.electric_cost ? (bill.electric_cost * tenantCountInRoom) : ''
      );
      const [electricSplit, setElectricSplit] = useState(
        bill.electric_cost || ''
      );

      const [waterCost, setWaterCost] = useState(
        bill.water_cost !== undefined && bill.water_cost !== null ? bill.water_cost : 30000
      );

      const [wasteCost, setWasteCost] = useState(
        bill.waste_cost !== undefined && bill.waste_cost !== null 
          ? bill.waste_cost 
          : Math.round(25000 / tenantCountInRoom)
      );

      const [extraGuestCost, setExtraGuestCost] = useState(
        bill.extra_guest_cost || ''
      );

      const [saving, setSaving] = useState(false);

      const handleRoomElectricChange = (val) => {
        setRoomElectricTotal(val);
        if (val === '') {
          setElectricSplit('');
        } else {
          setElectricSplit(Math.round(Number(val) / tenantCountInRoom));
        }
      };

      const numRent = Number(rentPortion || 0);
      const numElectric = Number(electricSplit || 0);
      const numWater = Number(waterCost || 0);
      const numWaste = Number(wasteCost || 0);
      const numExtra = Number(extraGuestCost || 0);

      const totalInvoice = numRent + numElectric + numWater + numWaste + numExtra;

      const handleSave = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          const totalUtility = numElectric + numWater + numWaste + numExtra;

          await db.from('bills').update({
            rent_amount: numRent,
            electric_cost: numElectric,
            water_cost: numWater,
            waste_cost: numWaste,
            extra_guest_cost: numExtra,
            utility_cost: totalUtility
          }).eq('id', bill.id);

          refresh();
          onClose();
        } catch (err) {
          alert('Gagal menyimpan rincian invoice: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-xs p-4 overflow-y-auto">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl my-6">
            <div className="mb-3">
              <h3 className="text-sm font-bold text-slate-100">Atur Rincian Invoice</h3>
              <p className="text-[11px] text-slate-400">
                {tenant?.full_name} • Kamar {room?.room_number} ({tenantCountInRoom} Orang di kamar ini)
              </p>
            </div>

            <form onSubmit={handleSave} className="space-y-3">
              <div>
                <label className="text-[10px] font-bold text-slate-400 block mb-1">Sewa Kamar (Porsi Orang Ini)</label>
                <input
                  type="number"
                  value={rentPortion}
                  onChange={(e) => setRentPortion(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200"
                />
              </div>

              <div className="bg-slate-950/70 p-2.5 rounded-xl border border-slate-800 space-y-1.5">
                <span className="text-[11px] font-bold text-sky-400">⚡ Listrik Kamar (Dibagi {tenantCountInRoom} Orang)</span>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-[9px] text-slate-400 block mb-0.5">Total Listrik Kamar</label>
                    <input
                      type="number"
                      placeholder="0"
                      value={roomElectricTotal}
                      onChange={(e) => handleRoomElectricChange(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-200"
                    />
                  </div>
                  <div>
                    <label className="text-[9px] text-slate-400 block mb-0.5">Porsi per Orang</label>
                    <input
                      type="number"
                      placeholder="0"
                      value={electricSplit}
                      onChange={(e) => setElectricSplit(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-sky-300 font-bold"
                    />
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-[10px] font-bold text-teal-400 block mb-1">💧 Air (Per Orang)</label>
                  <input
                    type="number"
                    value={waterCost}
                    onChange={(e) => setWaterCost(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200"
                  />
                </div>
                <div>
                  <label className="text-[10px] font-bold text-slate-400 block mb-1">🗑️ Uang Sampah</label>
                  <input
                    type="number"
                    value={wasteCost}
                    onChange={(e) => setWasteCost(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200"
                  />
                </div>
              </div>

              <div className="bg-amber-950/20 border border-amber-900/40 p-2.5 rounded-xl">
                <label className="text-[10px] font-bold text-amber-300 block mb-1">
                  👤 Tambahan Tamu / Non-Penyewa
                </label>
                <input
                  type="number"
                  placeholder="0 jika tidak ada tamu"
                  value={extraGuestCost}
                  onChange={(e) => setExtraGuestCost(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-amber-200"
                />
                <span className="text-[9px] text-slate-400 mt-0.5 block">Biaya ekstra jika ada teman/tamu menginap</span>
              </div>

              <div className="bg-slate-950 border border-slate-800 p-2.5 rounded-xl flex justify-between items-center">
                <span className="text-xs font-bold text-slate-300">Total Invoice Individu:</span>
                <span className="text-sm font-black text-emerald-400">
                  Rp {totalInvoice.toLocaleString('id-ID')}
                </span>
              </div>

              <div className="flex justify-end gap-2 pt-1">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-3 py-1.5 text-xs text-slate-400 hover:text-slate-200"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className="px-3.5 py-1.5 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl"
                >
                  {saving ? 'Menyimpan...' : 'Simpan Invoice'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function AddComplaintModal({ rooms, tenants, onClose, refresh }) {
      const [roomId, setRoomId] = useState(rooms[0]?.id || '');
      const [tenantId, setTenantId] = useState('');
      const [title, setTitle] = useState('');
      const [description, setDescription] = useState('');
      const [saving, setSaving] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          await db.from('complaints').insert([{
            room_id: roomId,
            tenant_id: tenantId || null,
            title,
            category: 'fasilitas',
            description,
            status: 'pending'
          }]);
          refresh();
          onClose();
        } catch (err) {
          alert('Gagal membuat tiket: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      const roomTenants = tenants.filter(t => t.room_id === roomId);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-xs p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl">
            <h3 className="text-sm font-bold text-slate-100 mb-3">Buat Tiket Komplain / Perbaikan</h3>
            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Pilih Kamar</label>
                <select
                  value={roomId}
                  onChange={(e) => {
                    setRoomId(e.target.value);
                    setTenantId('');
                  }}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200"
                  required
                >
                  {rooms.map((r) => (
                    <option key={r.id} value={r.id}>Kamar {r.room_number}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Penghuni Pelapor (Opsional)</label>
                <select
                  value={tenantId}
                  onChange={(e) => setTenantId(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200"
                >
                  <option value="">-- Pilih Penghuni --</option>
                  {roomTenants.map((t) => (
                    <option key={t.id} value={t.id}>{t.full_name}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Judul Keluhan</label>
                <input
                  type="text"
                  required
                  placeholder="Misal: AC tidak dingin / Kran bocor"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200"
                />
              </div>

              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Rincian Keluhan</label>
                <textarea
                  rows="3"
                  placeholder="Penjelasan kerusakan lebih detail..."
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200"
                />
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-3 py-1.5 text-xs text-slate-400 hover:text-slate-200"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className="px-3.5 py-1.5 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl"

    function AddRoomModal({ onClose, refresh }) {
      const [roomNumber, setRoomNumber] = useState('');
      const [price, setPrice] = useState('700000');
      const [saving, setSaving] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          await db.from('rooms').insert([{
            room_number: roomNumber,
            monthly_price: parseFloat(price),
            status: 'empty'
          }]);
          refresh();
          onClose();
        } catch (err) {
          alert('Gagal: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-xs p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl">
            <h3 className="text-sm font-bold text-slate-100 mb-3">Tambah Kamar Baru</h3>
            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Nomor / Nama Kamar</label>
                <input
                  type="text"
                  required
                  placeholder="Contoh: Kamar E"
                  value={roomNumber}
                  onChange={(e) => setRoomNumber(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                />
              </div>
              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Harga Sewa / Bulan (Rp)</label>
                <input
                  type="number"
                  required
                  value={price}
                  onChange={(e) => setPrice(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                />
              </div>
              <div className="flex justify-end gap-2 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-3 py-1.5 text-xs text-slate-400 hover:text-slate-200"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className="px-3.5 py-1.5 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl"
                >
                  {saving ? 'Menyimpan...' : 'Simpan'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function AddTenantModal({ rooms, onClose, refresh }) {
      const [roomId, setRoomId] = useState(rooms[0]?.id || '');
      const [fullName, setFullName] = useState('');
      const [phone, setPhone] = useState('');
      const [entryDate, setEntryDate] = useState(new Date().toISOString().split('T')[0]);
      const [dueDay, setDueDay] = useState(new Date().getDate());
      const [saving, setSaving] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!roomId) return alert('Pilih kamar terlebih dahulu');
        setSaving(true);
        try {
          const selectedRoom = rooms.find(r => r.id === roomId);

          const { data: tenant, error: tErr } = await db.from('tenants').insert([{
            room_id: roomId,
            full_name: fullName,
            phone,
            entry_date: entryDate,
            due_day: parseInt(dueDay)
          }]).select().single();
          if (tErr) throw tErr;

          await db.from('rooms').update({ status: 'occupied' }).eq('id', roomId);

          const billingMonth = new Date(entryDate);
          billingMonth.setDate(1);

          await db.from('bills').insert([{
            tenant_id: tenant.id,
            room_id: roomId,
            billing_month: billingMonth.toISOString().split('T')[0],
            rent_amount: selectedRoom.monthly_price,
            electric_cost: 0,
            water_cost: 30000,
            waste_cost: 25000,
            extra_guest_cost: 0,
            utility_cost: 55000,
            payment_status: 'unpaid',
            notes: 'Invoice pertama penghuni baru'
          }]);

          refresh();
          onClose();
        } catch (err) {
          alert('Gagal check-in: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-xs p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl">
            <h3 className="text-sm font-bold text-slate-100 mb-3">Check-In Penghuni Baru</h3>
            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Pilih Kamar</label>
                <select
                  value={roomId}
                  onChange={(e) => setRoomId(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                  required
                >
                  {rooms.map((r) => (
                    <option key={r.id} value={r.id}>
                      Kamar {r.room_number} - Rp {Number(r.monthly_price).toLocaleString('id-ID')}
                    </option>
                  ))}
                </select>
              </div>

              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">Nama Penghuni</label>
                <input
                  type="text"
                  required
                  placeholder="Nama lengkap"
                  value={fullName}
                  onChange={(e) => setFullName(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                />
              </div>

              <div>
                <label className="text-[11px] font-bold text-slate-400 block mb-1">No. WhatsApp</label>
                <input
                  type="tel"
                  required
                  placeholder="081234567890"
                  value={phone}
                  onChange={(e) => setPhone(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-[11px] font-bold text-slate-400 block mb-1">Tgl Masuk</label>
                  <input
                    type="date"
                    required
                    value={entryDate}
                    onChange={(e) => setEntryDate(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                  />
                </div>
                <div>
                  <label className="text-[11px] font-bold text-slate-400 block mb-1">Jatuh Tempo (Tgl)</label>
                  <input
                    type="number"
                    min="1"
                    max="31"
                    required
                    value={dueDay}
                    onChange={(e) => setDueDay(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-emerald-500"
                  />
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-3 py-1.5 text-xs text-slate-400 hover:text-slate-200"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className="px-3.5 py-1.5 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl"
                >
                  {saving ? 'Menyimpan...' : 'Check-In'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
